    why:"These aren't stylistic opinions — they describe how human perception works below the level of conscious thought, so violating them creates layouts that feel confusing even when every individual element is well-designed.",
    points:[{"text":"The six most commonly cited grouping principles:"},{"term":"Proximity","text":"things placed close together are perceived as related"},{"term":"Similarity","text":"things sharing a visual trait — color, shape, size — are perceived as related"},{"term":"Closure","text":"the eye fills in gaps to perceive a complete shape or group"},{"term":"Continuity","text":"elements arranged along a line or curve are perceived as connected"},{"term":"Figure / Ground","text":"the eye separates a foreground focus from a background"},{"term":"Common Region","text":"elements inside a shared boundary, like a card or box, are perceived as one group"}],
    when:"Apply it any time you're deciding how to lay out multiple related elements — form fields, card grids, navigation groups, dashboards.",
    how:"Use proximity and common region (borders, background shading) to group related fields or actions without needing extra labels; use similarity so all interactive elements share a consistent visual language; use figure/ground deliberately to focus attention, e.g. dimming the background behind a modal.",
    example:[
      "A checkout form groups 'City / State / ZIP' tightly together and separates it from the payment section with extra whitespace, using proximity alone to communicate structure.",
      "A modal dialog dims the rest of the page — figure/ground tells the eye exactly where to focus without an instruction."
    ],
    watch:"Relying on proximity or similarity alone when the actual grouping is ambiguous — if two different groupings are both visually plausible, add an explicit divider or label rather than trusting Gestalt cues to disambiguate for you."},

  {cat:"access", platform:"both", name:"Accessibility — POUR Principles", hook:"Usability that excludes a user isn't usability.",
    def:"The WCAG framework organizing digital accessibility into four principles: content and interfaces must be Perceivable, Operable, Understandable, and Robust for people using assistive technology.",
    why:"Accessibility gaps aren't edge cases — they affect a large share of any real user base (temporary injuries, aging users, bright sunlight on a phone screen, a broken trackpad) and are frequently a legal requirement, not just a nice-to-have.",
    points:[{"text":"Content must be:"},{"term":"Perceivable","text":"presentable through more than one sense — alt text for images, captions for video, sufficient color contrast"},{"term":"Operable","text":"usable without a mouse — full keyboard navigation, no interactions requiring precise timing or fine motor control"},{"term":"Understandable","text":"written in clear language, with predictable navigation and helpful error messages"},{"term":"Robust","text":"built to work reliably with assistive technology like screen readers, both now and as that technology evolves"}],
    when:"Apply it from the start of any design, not as an audit at the end — retrofitting accessibility onto a finished product is far more expensive than designing for it from the first wireframe.",
    how:"Check color contrast ratios, ensure every interactive element is reachable and operable by keyboard alone, add alt text and semantic HTML/ARIA labels, and test with a screen reader at least once per major flow.",
    example:[
      "A 'Submit' button with a 2:1 contrast ratio against its background fails Perceivable; increasing contrast to 4.5:1 fixes it.",
      "A custom dropdown that only responds to mouse clicks fails Operable until it also supports keyboard arrow keys and Enter."
    ],
    watch:"Treating accessibility as a single checkbox item near launch — real accessibility requires testing throughout the design and build process, not a one-time audit."},

  {cat:"vis", platform:"both", name:"Miller's Law (Chunking)", hook:"The mind holds about seven things at once — plan around it.",
    def:"The average person can hold roughly 5 to 9 (7±2) discrete items in short-term working memory at once, so grouping information into smaller, meaningful chunks lets people process far more than the same information presented as one long list.",
    why:"Every item beyond that working-memory limit isn't just 'a bit harder' — it's effectively invisible, since the mind has already run out of room to hold it while scanning the rest.",
    points:[{"text":"The average person can hold roughly 5 to 9 (7 ± 2) discrete items in short-term working memory at once."},{"text":"Grouping information into smaller, meaningful chunks lets people process and remember far more than the same information presented as one long, undifferentiated list."}],
    when:"Apply it to any long list of options, navigation items, or steps — phone numbers, form sections, and multi-step onboarding flows.",
    how:"Break long sequences into smaller chunks (like a phone number's area code / prefix / line number), and cap primary navigation to roughly seven or fewer top-level items, pushing the rest into a clearly labeled secondary menu.",
    example:[
      "A 12-digit account number displayed as 4 groups of 3 digits is dramatically easier to enter correctly than the same 12 digits with no separators.",
      "A navigation bar with 15 flat links gets restructured into 5 categories, each expandable — matching working memory instead of overwhelming it."
    ],
    watch:"Chunking for the sake of chunking — if grouping obscures a genuinely simple, short list, it adds a layer of navigation the user didn't need."},

  {cat:"mech", platform:"both", name:"Progressive Disclosure", hook:"Show the essentials first; earn the right to show the rest.",
    def:"A design approach that reveals only the options or information relevant to what the user is doing right now, deferring secondary, advanced, or rarely-used functionality behind a clear 'more' or 'advanced' entry point.",
    why:"Every visible option is a small tax on Hick's Law and cognitive load for every user, even the ones who'll never touch it — deferring rarely-used complexity keeps the common path fast while still leaving the door open for people who need more.",
    points:[{"text":"Reveal only the options relevant to what the user is doing right now."},{"text":"Defer secondary, advanced, or rarely-used functionality behind a clear 'more' or 'advanced' entry point."},{"text":"This keeps a screen approachable for first-time users without removing power-user functionality entirely."}],
    when:"Apply it whenever a feature genuinely serves two different audiences with two different needs — casual users who want the default path, and power users who want fine control.",
    how:"Identify the 80% use case and put only that on the primary screen; move the remaining options behind a clearly labeled 'Advanced settings' or 'More options' disclosure, and never hide something a majority of users actually need.",
    example:[
      "A camera app shows just a shutter button by default, with manual exposure and ISO controls tucked behind a 'Pro mode' toggle for the minority who want them.",
      "A search form shows one text field by default, with 'Advanced search' revealing date ranges and filters only when tapped."
    ],
    watch:"Burying functionality that most users actually need — progressive disclosure is for genuinely secondary features, not a way to avoid making hard prioritization calls on the main screen."},

  {cat:"vis", platform:"both", name:"Von Restorff Effect (Isolation Effect)", hook:"The odd one out is the one people remember.",
    def:"When one item in a group visually stands out from its surroundings — in color, size, or shape — it's disproportionately more likely to be noticed and remembered than the rest.",
    why:"It's a fast, reliable way to direct attention toward exactly one thing without adding any explanatory copy — but it only works as long as it's used sparingly.",
    points:[{"text":"When one item in a group visually stands out — in color, size, or shape — it's disproportionately more likely to be noticed and remembered."},{"text":"This works precisely because it's rare: if everything is highlighted, nothing is."}],
    when:"Apply it when there's one specific action or piece of information you genuinely want to stand out — a recommended pricing plan, a single primary CTA among secondary ones.",
    how:"Give the one element you want noticed a distinct color, size, or shape relative to its neighbors, and resist the urge to apply the same treatment to more than one thing on the same screen.",
    example:[
      "A pricing page renders four plans identically except the recommended one, which gets a colored border and a 'Most Popular' badge.",
      "In a list of grey secondary buttons, a single blue primary button draws the eye immediately without any label explaining why."
    ],
    watch:"Using isolation on more than one element per screen — once several things are all 'highlighted,' the effect cancels itself out and nothing stands out anymore."},

  {cat:"beh", platform:"both", name:"Peak-End Rule", hook:"People remember the peak and the ending — not the average.",
    def:"When recalling an experience afterward, people don't average every moment — they judge it almost entirely by its most intense point (positive or negative) and by how it ended.",
    why:"This means total time or effort invested isn't what determines whether a user walks away with a good impression — a handful of specific moments, especially the very last one, disproportionately shape the memory that drives whether they come back.",
    points:[{"text":"People judge an experience almost entirely by its most intense point (the peak) and by how it ended."},{"text":"A mostly-smooth experience with one bad friction point, or a weak final step, gets remembered as worse than the actual average moment-to-moment experience."}],
    when:"Apply it when designing the final step of any flow — a checkout confirmation, an offboarding flow, a support ticket resolution — and when deciding which specific pain point deserves fixing first.",
    how:"Invest deliberately in making the final moment of a flow feel good, even if the middle is still merely functional, and prioritize fixing the single worst friction point in a journey over making many small, evenly-distributed improvements.",
    example:[
      "A refund process that's mostly frustrating but ends with a clear, warm confirmation message walks away with a better overall impression than the moment-to-moment friction would suggest.",
      "An onboarding flow's final screen gets extra design polish — a small celebratory animation — specifically because it's the moment users will remember most."
    ],
    watch:"Polishing the ending while leaving a severe pain point untouched in the middle — the peak matters just as much as the end, and a bad enough peak will dominate the memory regardless of how the experience closes."},

  {cat:"mech", platform:"both", name:"Doherty Threshold (Perceived Performance)", hook:"Under 400 milliseconds, and the user never breaks stride.",
    def:"When a system responds to a user's action in under roughly 400 milliseconds, the interaction feels instantaneous and keeps the user's attention intact; beyond that threshold, attention starts to drift and engagement measurably drops.",
    why:"Response time isn't just a backend performance metric — it's a direct driver of whether a user stays mentally engaged with the task or mentally checks out and starts doing something else.",
    points:[{"text":"Under roughly 400 milliseconds, a response feels instantaneous and keeps the user's attention and flow intact."},{"text":"Beyond that threshold, users perceive a delay, their attention drifts, and their productivity and engagement measurably drop."}],
    when:"Apply it when evaluating any interaction with a network call or processing delay — search-as-you-type, form submission, page or screen transitions, app cold starts.",
    how:"For anything that can respond within ~400ms, do so and skip a loading indicator entirely; for anything slower, show an immediate loading state or skeleton screen within that same window so the system still feels responsive while real work continues in the background.",
    example:[
      "A search-as-you-type field returning results within 300ms feels instant; the same feature taking 1.5 seconds per keystroke feels sluggish enough that users stop trusting it.",
      "An app with a 3-second cold start adds a branded loading screen within the first 400ms so the delay feels intentional rather than broken."
    ],
    watch:"Treating loading states as a cosmetic afterthought — a spinner that appears after a visible stall, rather than within the 400ms window, reads as the system catching up to a failure, not as smooth performance."},

  {cat:"strat", platform:"mobile", name:"Platform Conventions (iOS HIG & Material Design)", hook:"Every OS already taught your users how it works.",
    def:"iOS and Android each define comprehensive design systems — Apple's Human Interface Guidelines and Google's Material Design — that specify exactly how navigation, gestures, and standard components should look and behave on that platform.",
    why:"Fighting platform convention forces every user of your app to unlearn muscle memory built from every other app on their phone — the cost of that relearning rarely buys enough differentiation to be worth it.",
    points:[{"text":"iOS users expect swipe-from-edge to go back and a tab bar at the bottom; Android users expect the hardware/gesture back button to always work and are more accustomed to a navigation drawer."},{"text":"Users bring these platform-level expectations into every app they open, regardless of who built it."}],
    when:"Apply it by default for any core navigation pattern (back behavior, tab bars, standard gestures) on mobile, reserving custom interaction patterns for the features that are actually your product's differentiator.",
    how:"Default to each platform's native navigation and component conventions rather than inventing custom equivalents, and reserve genuine novelty for the small number of interactions that define your product's unique value.",
    example:[
      "An Android app that doesn't respond to the hardware or gesture back button breaks a deeply ingrained platform expectation and frustrates nearly every Android user immediately.",
      "An iOS app using the standard tab bar and swipe-back gesture lets new users navigate confidently on their very first launch, with zero onboarding needed."
    ],
    watch:"Copy-pasting one platform's patterns onto the other — a straight port of an iOS tab bar onto Android, or vice versa, ignores real platform-level user expectations and feels subtly 'off.'"},

  {cat:"mech", platform:"mobile", name:"Touch Target Sizing", hook:"Fingers aren't cursors — design for the pad, not the tip.",
    def:"A finger's contact area is far larger and less precise than a mouse cursor, so touch targets need real minimum sizes to be reliably tappable — Apple recommends at least 44×44pt, Google recommends at least 48×48dp.",
    why:"A target below the minimum doesn't just look small — it produces genuine mis-taps, especially for users with larger fingers, motor impairments, or anyone using their phone one-handed while walking or multitasking.",
    points:[{"text":"Minimum reliably-tappable sizes: 44×44pt on iOS, 48×48dp on Android."},{"text":"The visible icon can stay smaller than that as long as the actual invisible tappable area meets the minimum — padding compensates for a small visual footprint."}],
    when:"Apply it to every tappable element on a touch interface, but especially icon-only buttons, list-item actions, and anything placed near another tappable element.",
    how:"Size every tap target to at least the platform minimum, and when a visual icon must stay small for aesthetic reasons, extend its invisible hit area with padding rather than shrinking the actual tappable region to match the icon.",
    example:[
      "A row of three small icon buttons spaced 4px apart gets redesigned with 48dp tap areas and enough spacing that adjacent buttons can no longer be mis-tapped for each other.",
      "A tiny 'x' close icon in the corner of a card keeps its small visual size but its actual tappable hit area is invisibly expanded to a full 44×44pt square."
    ],
    watch:"Measuring only the visible icon size and assuming that's the tap target — the two are different things, and only the actual hit area matters for usability."},

  {cat:"mech", platform:"mobile", name:"Offline & Connectivity Resilience", hook:"Mobile networks drop. Design like they will.",
    def:"Unlike most web apps used on a stable connection, mobile apps are regularly used on unreliable networks — subways, elevators, rural areas — and need to degrade gracefully, giving users a clear, honest signal of what's cached, what's syncing, and what needs a live connection.",
    why:"An app that silently fails or loses data the moment connectivity drops trains users not to trust it with anything important, which is a much harder problem to recover from than the outage itself.",
    points:[{"text":"Mobile apps are regularly used on unreliable networks and need to degrade gracefully rather than simply fail."},{"text":"Users need a clear, honest signal of connectivity state — what's cached, what's mid-sync, what needs a live connection."}],
    when:"Apply it to any mobile app where users might reasonably act while connectivity is unstable — messaging, note-taking, forms, anything involving user-generated content.",
    how:"Cache aggressively so recently-viewed content stays available offline, queue user actions (like a sent message) for automatic retry when connectivity returns rather than discarding them, and show an explicit offline/syncing/synced status rather than pretending the connection is always solid.",
    example:[
      "A messaging app queues an unsent message with a visible 'sending...' state that automatically retries and updates to 'sent' once connectivity returns, instead of silently failing.",
      "A notes app shows a small offline indicator and still lets you view and edit previously-loaded notes, syncing changes once the connection is back."
    ],
    watch:"Assuming a lost network request should just fail silently — from the user's perspective, an action that disappears without any status update is indistinguishable from data loss, even if it technically queued successfully."},

  {cat:"mech", platform:"web", name:"Responsive & Adaptive Layout", hook:"One layout, every screen, from phone browser to ultra-wide monitor.",
    def:"Responsive design uses fluid grids, relative units, and breakpoints so a single layout reflows cleanly across an enormous range of possible screen widths — unlike mobile apps, which typically design for a narrower, more predictable set of device sizes.",
    why:"Web users arrive on an unpredictable mix of screen sizes, from a small phone browser to an ultrawide monitor, all viewing the exact same URL — unlike a mobile app, which is built and tested for a known, bounded set of device dimensions.",
    points:[{"text":"Fluid grids, relative units, and breakpoints let a single layout reflow cleanly across a huge range of screen widths."},{"text":"Content priority, not just layout, often needs to change at each breakpoint — a sidebar on desktop might need to become a collapsible section on mobile web, not just a narrower sidebar."}],
    when:"Apply it to any web page or web app, testing across at least a small-mobile, tablet, and desktop breakpoint before considering a layout done.",
    how:"Design with fluid grids and relative units (%, rem, vw) rather than fixed pixel widths wherever layout needs to adapt, define clear breakpoints where the layout structure itself changes, and re-prioritize content at each breakpoint rather than simply shrinking everything proportionally.",
    example:[
      "A three-column desktop layout collapses to a single stacked column on mobile web, with the least essential column moved behind a 'more' link rather than shrunk to an unreadable width.",
      "A data table too wide for mobile screens converts to a stacked card-per-row layout below a certain breakpoint, rather than forcing horizontal scrolling."
    ],
    watch:"Treating 'responsive' as just scaling the same layout down proportionally — real responsive design often needs structural changes, not just smaller versions of the same arrangement."},

  {cat:"mech", platform:"web", name:"Browser Navigation & URL Predictability", hook:"The back button and the URL bar are part of your UI too.",
    def:"Web users rely on browser-level controls — back/forward, bookmarking, sharing a URL, opening a link in a new tab — as an extension of your product's own navigation, and a predictable URL structure lets them bookmark, share, and return to exactly where they were.",
    why:"Breaking browser-native behavior, like a back button that doesn't return to the expected previous state, doesn't just annoy users — it actively erodes the sense of control the entire web platform trained them to expect.",
    points:[{"text":"Users treat browser controls — back/forward, bookmarking, sharing a URL — as part of your product's own navigation, whether or not you designed for them."},{"text":"A predictable URL structure lets people bookmark, share, and return to exactly the state they left."}],
    when:"Apply it to any multi-step or multi-state web flow — search results with filters applied, a multi-step form, a single-page app with dynamic content.",
    how:"Update the URL to reflect meaningful state changes (filters, tabs, steps) using the History API, ensure the back button returns to the actual previous state rather than reloading or resetting the page, and make sure a shared or bookmarked URL reproduces the exact view the user saved.",
    example:[
      "An e-commerce search page updates its URL with the applied filters, so a shared link opens directly to the same filtered results instead of the unfiltered default.",
      "A single-page app form that breaks the back button, sending users all the way out of the flow instead of to the previous step, causes measurable step abandonment."
    ],
    watch:"Building a rich single-page interface that silently ignores browser history entirely — it works fine until a user does something web-native like hitting back or bookmarking, and the illusion breaks."}
];

const SCENARIOS = [
  {q:"Your checkout form has 15 required fields crammed onto a single page, and users are abandoning it. Which principle best explains the fix of splitting it into a guided multi-step flow?",
   options:["Tesler's Law","Fitts's Law","Poka-Yoke","The Hook Model"], correct:0,
   why:"Tesler's Law — the form's complexity can't disappear, but a multi-step flow with smart defaults shifts the burden from the user's working memory onto the software."},
  {q:"Your Save and Delete buttons sit right next to each other, and users keep tapping the wrong one. What principle should guide the fix?",
   options:["Hick's Law","Poka-Yoke","Mappings","Visual Hierarchy"], correct:1,
   why:"Poka-Yoke — error-proofing the interface (spacing, confirmation step, distinct styling) prevents the mistake rather than just letting it happen."},
  {q:"A country dropdown lists 50 countries alphabetically with no grouping, and users take a long time to find theirs. What law explains why grouping by continent would speed this up?",
   options:["Fitts's Law","Tesler's Law","Hick's Law","Cognitive Load"], correct:2,
   why:"Hick's Law — decision time scales with the number of choices; grouping reduces the effective number of options a user scans at once."},
  {q:"A brand-new user opens your dashboard and sees a completely blank screen with no guidance. Which UI Stack state were the designers responsible for handling?",
   options:["Loading State","Error State","Empty/Blank State","Partial State"], correct:2,
   why:"Empty/Blank State — this is the first-time experience, and it should actively onboard the user rather than leave them staring at nothing."},
  {q:"On a mobile app, the primary action button sits within easy reach of the thumb at the bottom of the screen during one-handed use. Which concept describes this choice?",
   options:["Affordances","Ergonomics / Thumb Zone","Mappings","Scanning vs Reading"], correct:1,
   why:"Ergonomics & the Thumb Zone — mobile layouts should map comfortable one-handed reach, especially for frequent primary actions."},
  {q:"Duolingo sends a push notification saying 'Your streak is about to expire!' In the Hook Model, this is the:",
   options:["Investment","Variable Reward","Trigger","Action"], correct:2,
   why:"Trigger — an external nudge (the notification) that cues the user to open the app and begin the loop again."},
  {q:"After finishing a lesson, Duolingo shows your streak count climbing to 27 days. In the Hook Model, this streak count itself is the:",
   options:["Trigger","Investment","Variable Reward","Ability"], correct:1,
   why:"Investment — the accumulated streak is 'stored value' the user has put in, which raises the product's value and sets up tomorrow's trigger."},
  {q:"Users say they *want* to update their profile photo, and they get reminded regularly — but the upload flow is buried four menus deep, so almost no one does it. Per the Fogg Behavior Model, what's missing?",
   options:["Motivation","Trigger","Ability","Purpose"], correct:2,
   why:"Ability — motivation and trigger are already present; the task itself is simply too hard to complete, so B=MAT never converges."},
  {q:"A volume slider's handle visually moves upward as you drag it, matching the sound getting louder. This is an example of:",
   options:["Signifiers","Mappings","Feedback","Discoverability"], correct:1,
   why:"Mappings — the control's spatial motion (up) naturally corresponds to its effect (increased volume)."},
  {q:"A search bar has a small magnifying-glass icon inside it that hints 'type here to search.' The icon itself is a:",
   options:["Affordance","Signifier","Mapping","Trigger"], correct:1,
   why:"Signifier — it's the visual cue communicating where and how to interact; the affordance is the actual ability to type and search."},
  {q:"When a user hovers a button, it changes color slightly and shows a subtle press animation on click. This interaction principle is:",
   options:["Feedback","Poka-Yoke","Visual Hierarchy","The CREATE Funnel"], correct:0,
   why:"Feedback — every action should be met with a clear, immediate signal that it registered."},
  {q:"A social feed shows greyed-out placeholder boxes shaped like posts while content is being fetched. Which UI Stack state is this?",
   options:["Empty State","Loading State","Partial State","Error State"], correct:1,
   why:"Loading State — skeleton screens manage the user's perception of speed while data is fetched."},
  {q:"A PM wants to validate a risky assumption with the least possible engineering investment before committing to a full build. Which framework fits best?",
   options:["Double Diamond","Lean UX","Human-Centered Design","UX Strategy Tenets"], correct:1,
   why:"Lean UX — it prioritizes fast, cheap MVPs and learning over polished deliverables."},
  {q:"A researcher spends two weeks in the field watching farmers use paper ledgers before designing any screens, looking for unmet 'thoughtless act' needs. This approach is:",
   options:["Lean UX","Double Diamond","Human-Centered Design","Design Thinking Constraints"], correct:2,
   why:"Human-Centered Design — it starts with direct observation of real behavior in context, not assumptions or quick prototypes."},
  {q:"A team brainstorms 40 possible solutions, then narrows down to the top 3 to prototype and test. Which stage pairing of the Double Diamond does this represent?",
   options:["Discover → Define","Develop → Deliver","Define → Develop","Discover → Deliver"], correct:0,
   why:"Discover → Define — generating many ideas is divergent (Discover), and narrowing to the top few is convergent (Define)."},
  {q:"Before opening Figma, a PM drafts the exact wording of every error message and empty state to define the dialogue with the user first. This reflects:",
   options:["Start With Words","The Squint Test","Scanning vs Reading","UX Strategy Tenets"], correct:0,
   why:"Start With Words — copy is treated as design material that shapes the experience before any visual layout exists."},
  {q:"A pricing page uses a large bold headline for the plan name, a medium subhead for the price, and small print for fine details — so the eye instantly knows what matters most. This is:",
   options:["Scanning vs Reading","Visual Hierarchy","Pattern Recognition","Cognitive Load"], correct:1,
   why:"Visual Hierarchy — size, weight, and position are used to signal relative importance at a glance."},
  {q:"A designer blurs their eyes at a mockup to check whether the call-to-action button still stands out from the rest of the page. This technique is called:",
   options:["The Squint Test","Poka-Yoke","Fitts's Law","Discoverability"], correct:0,
   why:"The Squint Test — blurring out detail reveals whether the visual hierarchy is strong enough to survive at a glance."},
  {q:"You're asked to review a signup screen quickly, without running a user test, using an industry-standard 10-point checklist. Which framework do you reach for?",
   options:["Nielsen's 10 Usability Heuristics","Design Thinking Constraints","Double Diamond Model","UX Strategy Tenets"], correct:0,
   why:"Nielsen's 10 Usability Heuristics — it's the default checklist for a fast, structured heuristic evaluation without needing real users."},
  {q:"A form groups City, State, and ZIP tightly together with extra whitespace before the payment section — no labels or dividers needed to show they're related. Which principle explains why this works?",
   options:["Gestalt Principles (Proximity)","Visual Hierarchy","Von Restorff Effect","Miller's Law"], correct:0,
   why:"Gestalt's principle of Proximity — elements placed close together are automatically perceived as related, without needing an explicit label."},
  {q:"A custom dropdown only responds to mouse clicks — keyboard users can't open or select from it at all. Which principle is being violated?",
   options:["Accessibility — POUR Principles (Operable)","Poka-Yoke","Cognitive Load","Discoverability"], correct:0,
   why:"Accessibility's Operable principle — every interactive element must be usable without a mouse, including full keyboard navigation."},
  {q:"A 12-digit account number is displayed as 4 groups of 3 digits instead of one long unbroken string. Which principle explains why this is easier to enter correctly?",
   options:["Miller's Law (Chunking)","Hick's Law","Cognitive Load (Motor)","Visual Hierarchy"], correct:0,
   why:"Miller's Law — breaking a long string into small chunks matches the roughly 7-item limit of short-term working memory, making it far easier to hold and enter correctly."},
  {q:"A camera app shows just a shutter button by default, with manual exposure and ISO controls tucked behind a 'Pro mode' toggle for the minority who want them. Which principle is this?",
   options:["Progressive Disclosure","Tesler's Law","Hick's Law","Discoverability"], correct:0,
   why:"Progressive Disclosure — reveal only what most users need by default, and defer advanced functionality behind a clear, secondary entry point."},
  {q:"On a pricing page, four plans look identical except the recommended one, which has a colored border and a 'Most Popular' badge. Which principle explains why that plan gets noticed first?",
   options:["Von Restorff Effect (Isolation)","Visual Hierarchy","Gestalt Principles","Aesthetics & Emotion"], correct:0,
   why:"Von Restorff Effect — an item that visually stands out from an otherwise uniform group is disproportionately more likely to be noticed and remembered."},
  {q:"A refund process is mostly frustrating, but ends with a clear, warm confirmation message — and users walk away with a better overall impression than the moment-to-moment friction would suggest. Which principle explains this?",
   options:["Peak-End Rule","The Hook Model","Aesthetics & Emotion","Self-Determination Theory"], correct:0,
   why:"Peak-End Rule — people judge an experience by its most intense moment and its ending, not by averaging every moment along the way."},
  {q:"An app adds a branded loading screen within the first 400 milliseconds of a 3-second cold start, so the delay feels intentional rather than broken. Which principle explains the 400ms threshold?",
   options:["Doherty Threshold","Feedback","The UI Stack (Loading State)","Cognitive Load"], correct:0,
   why:"Doherty Threshold — responses under roughly 400ms feel instantaneous; beyond that, showing an immediate loading state keeps the system feeling responsive even while real work continues."},
  {q:"An Android app doesn't respond to the hardware or gesture back button, breaking a deeply ingrained platform expectation. Which principle is being violated?",
   options:["Platform Conventions (iOS HIG / Material Design)","Ergonomics & the Thumb Zone","Discoverability","Visual Hierarchy"], correct:0,
   why:"Platform Conventions — users bring expectations from every other app on their OS, and Android's back-button behavior is one of the most deeply ingrained of all."},
  {q:"Three small icon buttons spaced only 4px apart on a mobile screen keep getting mis-tapped. Which principle explains the fix?",
   options:["Touch Target Sizing","Fitts's Law","Ergonomics & the Thumb Zone","Poka-Yoke"], correct:0,
   why:"Touch Target Sizing — mobile platforms define concrete minimum tappable sizes (44×44pt on iOS, 48×48dp on Android) precisely because a finger's contact area is far less precise than a cursor."},
  {q:"A messaging app queues an unsent message with a visible 'sending…' state that automatically retries and updates to 'sent' once connectivity returns, instead of silently failing. Which principle is this?",
   options:["Offline & Connectivity Resilience","Feedback","Poka-Yoke","The UI Stack (Error State)"], correct:0,
   why:"Offline & Connectivity Resilience — mobile networks drop constantly, so actions should be queued and clearly status-tracked rather than silently lost."},
  {q:"A three-column desktop layout collapses to a single stacked column on mobile web, with the least essential column moved behind a 'more' link rather than just shrunk down. Which principle is this?",
   options:["Responsive & Adaptive Layout","Ergonomics & the Thumb Zone","Progressive Disclosure","Visual Hierarchy"], correct:0,
   why:"Responsive & Adaptive Layout — real responsive design re-prioritizes content structure at each breakpoint, not just scales the same layout down proportionally."},
  {q:"An e-commerce search page updates its URL to reflect the applied filters, so a shared link opens directly to the same filtered results. Which principle is this?",
   options:["Browser Navigation & URL Predictability","Discoverability","Feedback","Responsive & Adaptive Layout"], correct:0,
   why:"Browser Navigation & URL Predictability — a predictable URL structure lets users bookmark, share, and return to exactly the state they left, treating the URL as part of the UI."},
];

let state = {
  view: "library",
  search: "",
  activeCat: "all",
  activePlatform: "all",
  squint: false,
  openPrincipleIdx: null,
  quizOrder: [],
  quizIndex: 0,
  quizScore: 0,
  quizAnswered: null,
  quizHistory: [],
  quizDone: false,
};

function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function resetQuiz(){
  state.quizOrder = shuffledIndices(SCENARIOS.length);
  state.quizIndex = 0;
  state.quizScore = 0;
  state.quizAnswered = null;
  state.quizHistory = [];
  state.quizDone = false;
}
resetQuiz();

function catCounts(platformFilter){
  const c = {};
  PRINCIPLES.filter(p=> platformFilter==='all' || p.platform===platformFilter || p.platform==='both').forEach(p=>{ c[p.cat] = (c[p.cat]||0)+1; });
  return c;
}
function platformCounts(catFilter){
  const c = {all:0, web:0, mobile:0};
  PRINCIPLES.filter(p=> catFilter==='all' || p.cat===catFilter).forEach(p=>{
    c.all++;
    if(p.platform==='web' || p.platform==='both') c.web++;
    if(p.platform==='mobile' || p.platform==='both') c.mobile++;
  });
  return c;
}
function renderLibrary(){
  const counts = catCounts(state.activePlatform);
  const catPills = ['<button class="pill" data-cat="all" data-active="'+(state.activeCat==='all')+'" onclick="setCat(\'all\')">✨ All <span class="count">'+PRINCIPLES.filter(p=>state.activePlatform==='all'||p.platform===state.activePlatform||p.platform==='both').length+'</span></button>']
    .concat(Object.keys(CATS).map(c=>{
      const active = state.activeCat===c;
      return `<button class="pill" data-cat="${c}" data-active="${active}" onclick="setCat('${c}')">${CATS[c].icon} ${CATS[c].label} <span class="count">${counts[c]||0}</span></button>`;
    })).join('');

  const platCounts = platformCounts(state.activeCat);
  const platSegments = ['all','web','mobile'].map(pk=>{
    const active = state.activePlatform===pk;
    const label = pk==='all' ? 'All' : PLATFORMS[pk].label;
    const icon = pk==='all' ? '🔁' : PLATFORMS[pk].icon;
    const count = pk==='all' ? platCounts.all : platCounts[pk];
    return `<button class="segment" data-active="${active}" onclick="setPlatform('${pk}')">${icon} ${label} <span class="count">${count}</span></button>`;
  }).join('');

  const filtered = PRINCIPLES.filter(p=>{
    const matchesCat = state.activeCat==='all' || p.cat===state.activeCat;
    const matchesPlatform = state.activePlatform==='all' || p.platform===state.activePlatform || p.platform==='both';
    const q = state.search.trim().toLowerCase();
    const matchesSearch = !q || p.name.toLowerCase().includes(q) || p.hook.toLowerCase().includes(q) || p.def.toLowerCase().includes(q);
    return matchesCat && matchesPlatform && matchesSearch;
  });

  const filtersActive = state.activeCat!=='all' || state.activePlatform!=='all' || state.search.trim()!=='';
  const activeLabelParts = [];
  if(state.activePlatform!=='all') activeLabelParts.push(PLATFORMS[state.activePlatform].icon+' '+PLATFORMS[state.activePlatform].label);
  if(state.activeCat!=='all') activeLabelParts.push(CATS[state.activeCat].icon+' '+CATS[state.activeCat].label);
  const summaryText = activeLabelParts.length ? `${filtered.length} of ${PRINCIPLES.length} principles — ${activeLabelParts.join(' + ')}` : `${filtered.length} of ${PRINCIPLES.length} principles`;

  const cards = filtered.map(p=>{
    const realIdx = PRINCIPLES.indexOf(p);
    const platInfo = PLATFORMS[p.platform];
    return `
    <div class="card" data-cat="${p.cat}" tabindex="0" role="button" aria-label="Open details for ${p.name}"
         onclick="openPrinciple(${realIdx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); openPrinciple(${realIdx});}">
      <div class="cat-row">
        <span class="cat-tag">${CATS[p.cat].icon} ${CATS[p.cat].label}</span>
        <span class="platform-badge">${platInfo.icon} ${platInfo.label}</span>
      </div>
      <h3>${p.name}</h3>
      <p class="hook">${p.hook}</p>
      <span class="explore-row">Explore
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </div>`;
  }).join('');

  return `
    <div class="lib-controls">
      <div class="search-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8886a3" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search principles, e.g. 'Fitts' or 'Hook Model'..." value="${state.search}" oninput="setSearch(this.value)"/>
      </div>
      ${filtersActive ? `<button class="reset-chip" onclick="resetFilters()">✕ Reset filters</button>` : ''}
    </div>

    <div class="filter-block">
      <div class="filter-block-label">📱 Platform <span class="hint">— pick one, applies to devices this principle is relevant for</span></div>
      <div class="segmented">${platSegments}</div>
    </div>

    <div class="filter-block">
      <div class="filter-block-label">🗂️ Category <span class="hint">— filters the topic area below</span></div>
      <div class="lib-controls pill-row">${catPills}</div>
    </div>

    <p class="squint-hint">💡 Toggle Squint Test (top right) to feel the Squint Test principle live.</p>
    <p class="result-count">${summaryText}</p>
    <div class="grid">${cards || `<div class="empty-state">No principles match your filters.<br><button class="reset-chip" style="margin:10px 0 0;" onclick="resetFilters()">✕ Reset filters</button></div>`}</div>
  `;
}
function setCat(c){ state.activeCat = c; render(); }
function setPlatform(pk){ state.activePlatform = pk; render(); }
function resetFilters(){ state.activeCat='all'; state.activePlatform='all'; state.search=''; render(); }
function setSearch(v){ state.search = v; render(true); }

function openPrinciple(idx){ state.openPrincipleIdx = idx; renderModal(); }
function closePrinciple(){ state.openPrincipleIdx = null; renderModal(); }

function renderModal(){
  const root = document.getElementById('modalRoot');
  if(state.openPrincipleIdx===null){ root.innerHTML=''; return; }
  const p = PRINCIPLES[state.openPrincipleIdx];
  const examples = p.example.map(e=>`<li>${e}</li>`).join('');
  const points = p.points.map(pt=>{
    if(pt.term){
      return `<li class="point-term"><span class="point-term-label">${pt.term}</span>${pt.text}</li>`;
    }
    const isIntro = pt.text.trim().endsWith(':');
    return `<li class="${isIntro ? 'point-intro' : 'point-plain'}">${pt.text}</li>`;
  }).join('');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closePrinciple();">
      <div class="modal" data-cat="${p.cat}" role="dialog" aria-modal="true" aria-label="${p.name} details">
        <div class="modal-top">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span class="cat-tag">${CATS[p.cat].icon} ${CATS[p.cat].label}</span>
            <span class="platform-badge">${PLATFORMS[p.platform].icon} ${PLATFORMS[p.platform].label}</span>
          </div>
          <button class="modal-close" onclick="closePrinciple()" aria-label="Close">✕</button>
        </div>
        <h2>${p.name}</h2>
        <p class="modal-hook">${p.hook}</p>

        <div class="section-label">📖 What it means</div>
        <ul class="points-list">${points}</ul>

        <div class="section-label">🤔 Why it matters</div>
        <p class="body-text">${p.why}</p>

        <div class="two-col">
          <div class="two-col-item">
            <div class="section-label small">⏰ When to apply it</div>
            <p class="body-text small">${p.when}</p>
          </div>
          <div class="two-col-item">
            <div class="section-label small">🛠️ How to apply it</div>
            <p class="body-text small">${p.how}</p>
          </div>
        </div>

        <div class="section-label">🧪 In practice</div>
        <ul class="example-list">${examples}</ul>

        ${p.watch ? `
        <div class="section-label">⚠️ Watch out for</div>
        <div class="watch-box"><strong>Common pitfall:</strong> ${p.watch}</div>
        ` : ''}
      </div>
    </div>
  `;
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && state.openPrincipleIdx !== null){ closePrinciple(); }
});

function renderScenarios(){
  if(state.quizDone){
    const byCat = {};
    state.quizHistory.forEach(h=>{
      byCat[h.cat] = byCat[h.cat] || {correct:0,total:0};
      byCat[h.cat].total++;
      if(h.correct) byCat[h.cat].correct++;
    });
    const breakdown = Object.keys(byCat).map(c=>`
      <div class="bd-item">
        <div style="font-size:12px;color:var(--ink-soft);font-weight:600;">${CATS[c].icon} ${CATS[c].label}</div>
        <div class="n">${byCat[c].correct} / ${byCat[c].total}</div>
      </div>`).join('');
    const missed = state.quizHistory.filter(h=>!h.correct).map(h=>`
      <div class="missed-item"><strong>${h.q}</strong><br/>→ Correct answer: ${h.correctLabel}. ${h.why}</div>`).join('');
    return `
      <div class="results">
        <h2>🎉 Practice complete</h2>
        <div class="big-score">${state.quizScore} / ${SCENARIOS.length}</div>
        <p style="color:var(--ink-soft);">Here's how you did across each category:</p>
        <div class="breakdown">${breakdown}</div>
        <button class="restart-btn" onclick="restartQuiz()">Practice again (new shuffle)</button>
        ${missed.length ? `<div class="missed-list"><h3 style="font-size:16px;">Review what you missed</h3>${missed}</div>` : `<p style="margin-top:20px;font-weight:600;">Perfect score — nice work! 🔥</p>`}
      </div>
    `;
  }

  const sIdx = state.quizOrder[state.quizIndex];
  const s = SCENARIOS[sIdx];
  const pct = Math.round((state.quizIndex/SCENARIOS.length)*100);

  const options = s.options.map((opt, i)=>{
    let cls = "option-btn";
    let disabled = "";
    if(state.quizAnswered !== null){
      disabled = "disabled";
      if(i===s.correct) cls += " reveal-correct";
      else if(i===state.quizAnswered) cls += " incorrect";
    }
    return `<button class="${cls}" ${disabled} onclick="answerQuiz(${i})">${opt}</button>`;
  }).join('');

  const feedback = state.quizAnswered !== null ? `
    <div class="feedback-box">
      <strong>${state.quizAnswered===s.correct ? "✅ Correct — " : "❌ Not quite — "}</strong>${s.why}
    </div>
    <button class="next-btn" onclick="nextQuiz()">${state.quizIndex===SCENARIOS.length-1 ? "See results" : "Next scenario →"}</button>
  ` : '';

  return `
    <div class="scenario-wrap">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="score-chip">${state.quizIndex+1} / ${SCENARIOS.length} · score ${state.quizScore}</span>
      </div>
      <div class="scenario-card">
        <div class="scenario-eyebrow">Scenario</div>
        <p class="scenario-text">${s.q}</p>
        <div class="options">${options}</div>
        ${feedback}
      </div>
    </div>
  `;
}
function answerQuiz(i){
  if(state.quizAnswered !== null) return;
  const sIdx = state.quizOrder[state.quizIndex];
  const s = SCENARIOS[sIdx];
  const correct = i === s.correct;
  state.quizAnswered = i;
  if(correct) state.quizScore++;
  state.quizHistory.push({
    q: s.q, why: s.why, correct,
    correctLabel: s.options[s.correct],
    cat: guessCatFromOption(s.options[s.correct])
  });
  render();
}
function guessCatFromOption(optionLabel){
  const p = PRINCIPLES.find(p=>p.name.toLowerCase().includes(optionLabel.toLowerCase()) || optionLabel.toLowerCase().includes(p.name.split(' ')[0].toLowerCase()));
  return p ? p.cat : 'strat';
}
function nextQuiz(){
  if(state.quizIndex === SCENARIOS.length-1){
    state.quizDone = true;
  } else {
    state.quizIndex++;
    state.quizAnswered = null;
  }
  render();
}
function restartQuiz(){ resetQuiz(); render(); }

function render(keepFocus){
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.view === state.view);
  });
  document.body.classList.toggle('squinting', state.squint);
  const main = document.getElementById('main');
  main.innerHTML = state.view === 'library' ? renderLibrary() : renderScenarios();
  if(keepFocus){
    const inp = document.getElementById('searchInput');
    if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
  }
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{ state.view = t.dataset.view; state.openPrincipleIdx=null; renderModal(); render(); });
});

const squintBtn = document.getElementById('squintBtn');
squintBtn.addEventListener('click', ()=>{
  state.squint = !state.squint;
  squintBtn.classList.toggle('on', state.squint);
  document.getElementById('squintLabel').textContent = state.squint ? "Squinting..." : "Squint Test";
  document.getElementById('squintIcon').textContent = state.squint ? "🙈" : "👀";
  render();
});

render();
</script>
</body>
</html>
