<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UIUX Principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAFAFF;
    --ink: #1A1A2E;
    --ink-soft: #55536E;
    --paper: #FFFFFF;
    --line: #E7E5F5;

    --laws: #FF6B6B;      --laws-tint: #FFEDED;      --laws-dark:#B23A3A;
    --mech: #06B6A4;      --mech-tint: #E4FBF8;      --mech-dark:#0A7F72;
    --vis: #F5A524;       --vis-tint: #FFF5E0;       --vis-dark:#9C6B0E;
    --beh: #8B5CF6;       --beh-tint: #F2ECFF;       --beh-dark:#5B32B8;
    --strat: #3B82F6;     --strat-tint: #EAF1FF;     --strat-dark:#1E4FA3;
    --access: #22C55E;    --access-tint: #E9FBEF;    --access-dark:#15803D;

    --shadow: 0 2px 0 rgba(26,26,46,0.9);
    --shadow-lg: 0 8px 0 rgba(26,26,46,0.9);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 8%, rgba(255,107,107,0.08) 0, transparent 40%),
      radial-gradient(circle at 92% 15%, rgba(59,130,246,0.08) 0, transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(139,92,246,0.07) 0, transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
    padding-bottom: 60px;
  }
  h1,h2,h3,.display{ font-family:'Fredoka', sans-serif; font-weight:600; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  button{ font-family: inherit; }

  header{
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 24px 12px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand svg{ flex-shrink:0; transition: transform .25s ease; }
  .brand:hover svg{ transform: rotate(-8deg) scale(1.05); }
  .brand-text h1{ font-size: 28px; margin:0; letter-spacing:-0.02em; }
  .brand-text p{ margin:2px 0 0; color:var(--ink-soft); font-size:13.5px; }

  .squint-btn{
    display:flex; align-items:center; gap:8px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 10px 18px;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: transform .12s ease;
    color: var(--ink);
  }
  .squint-btn:active{ transform: translateY(2px); box-shadow:none; }
  .squint-btn.on{ background: var(--beh); color:white; }

  .tabbar{
    max-width:1080px; margin: 18px auto 0; padding: 0 24px;
    display:flex; gap:10px;
  }
  .tab{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px;
    padding: 12px 22px; border-radius: 14px 14px 0 0;
    border: 2px solid var(--ink); border-bottom:none;
    background: var(--line);
    color: var(--ink-soft);
    cursor:pointer;
    position:relative; top:2px;
  }
  .tab.active{ background: var(--paper); color:var(--ink); top:0; }
  main{
    max-width:1080px; margin: 0 auto; padding: 0 24px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 0 18px 18px 18px;
    min-height: 400px;
    padding-top:26px;
  }

  .filter-block{ margin-bottom: 14px; }
  .filter-block-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.07em; margin: 0 0 6px; display:flex; align-items:center; gap:6px;
  }
  .filter-block-label .hint{ font-weight:500; text-transform:none; letter-spacing:0; opacity:.75; font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; }

  .segmented{
    display:inline-flex; border:2px solid var(--ink); border-radius:12px; overflow:hidden;
    box-shadow: var(--shadow);
  }
  .segment{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px;
    padding:9px 16px; cursor:pointer; background:var(--paper); color:var(--ink);
    border:none; border-right:2px solid var(--ink); display:flex; align-items:center; gap:6px;
    transition: background .1s ease;
  }
  .segment:last-child{ border-right:none; }
  .segment .count{ font-family:'JetBrains Mono',monospace; font-weight:600; font-size:11px; opacity:.6; }
  .segment[data-active="true"]{ background:var(--ink); color:white; }
  .segment[data-active="true"] .count{ opacity:.85; }
  .segment:hover:not([data-active="true"]){ background: var(--bg); }

  .reset-chip{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:12.5px;
    color: var(--laws-dark); background: var(--laws-tint); border:1.5px solid var(--laws);
    border-radius:999px; padding:7px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
    margin-left:10px;
  }
  .reset-chip:hover{ filter:brightness(0.97); }

  .lib-controls{ display:flex; align-items:center; margin-bottom:8px; }
  .lib-controls.pill-row{
    gap:8px; overflow-x:auto; flex-wrap:nowrap; padding-bottom:4px;
    scrollbar-width: thin;
  }
  .search-wrap{ position:relative; flex: 1 1 260px; }
  .search-wrap input{
    width:100%; padding: 13px 16px 13px 42px; border-radius: 12px;
    border: 2px solid var(--line); font-size:15px; font-family:inherit;
    background: var(--bg);
  }
  .search-wrap input:focus{ outline:none; border-color:var(--ink); }
  .search-wrap svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); }

  .pill{
    display:flex; align-items:center; gap:6px; flex-shrink:0;
    border:2px solid var(--ink); border-radius:999px; padding:8px 13px;
    font-size:12.5px; font-weight:600; cursor:pointer; background:var(--paper); color:var(--ink);
    font-family:'Fredoka',sans-serif;
    white-space:nowrap;
    transition: transform .1s ease;
  }
  .pill:hover{ transform: translateY(-1px); }
  .pill .count{ font-family:'JetBrains Mono',monospace; font-weight:600; font-size:11px; opacity:.65; }
  .pill[data-active="true"]{ color:white; }
  .pill[data-active="true"] .count{ opacity:.85; }
  .pill[data-cat="laws"][data-active="true"]{ background:var(--laws); }
  .pill[data-cat="mech"][data-active="true"]{ background:var(--mech); }
  .pill[data-cat="vis"][data-active="true"]{ background:var(--vis); }
  .pill[data-cat="beh"][data-active="true"]{ background:var(--beh); }
  .pill[data-cat="strat"][data-active="true"]{ background:var(--strat); }
  .pill[data-cat="access"][data-active="true"]{ background:var(--access); }
  .pill[data-cat="all"][data-active="true"]{ background:var(--ink); }


  .squint-hint{ font-size:12.5px; color: var(--ink-soft); margin: 4px 0 20px; font-style:italic; }
  .result-count{ font-size:12.5px; color:var(--ink-soft); margin: 0 0 14px; font-weight:600; }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap:16px; padding-bottom: 30px;
  }
  .card{
    border-radius:16px; border:2px solid var(--ink); padding:18px;
    display:flex; flex-direction:column; gap:10px;
    box-shadow: var(--shadow);
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    min-height: 168px;
  }
  .card:hover{ transform: translate(-2px,-2px); box-shadow: 5px 6px 0 rgba(26,26,46,0.9); }
  .card:focus-visible{ outline: 3px solid var(--ink); outline-offset:2px; }
  .card[data-cat="laws"]{ background: var(--laws-tint); }
  .card[data-cat="mech"]{ background: var(--mech-tint); }
  .card[data-cat="vis"]{ background: var(--vis-tint); }
  .card[data-cat="beh"]{ background: var(--beh-tint); }
  .card[data-cat="strat"]{ background: var(--strat-tint); }
  .card[data-cat="access"]{ background: var(--access-tint); }

  .cat-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .cat-tag{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em;
    padding:4px 9px; border-radius:6px; display:flex; align-items:center; gap:5px;
    background: rgba(255,255,255,0.65); border:1.5px solid rgba(26,26,46,0.22);
  }
  .card[data-cat="laws"] .cat-tag{ color:var(--laws-dark); }
  .card[data-cat="mech"] .cat-tag{ color:var(--mech-dark); }
  .card[data-cat="vis"] .cat-tag{ color:var(--vis-dark); }
  .card[data-cat="beh"] .cat-tag{ color:var(--beh-dark); }
  .card[data-cat="strat"] .cat-tag{ color:var(--strat-dark); }
  .card[data-cat="access"] .cat-tag{ color:var(--access-dark); }

  .platform-badge{
    font-size:10.5px; font-weight:700; font-family:'JetBrains Mono',monospace;
    padding:3px 8px; border-radius:6px; background: rgba(26,26,46,0.08); color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
  }

  .card h3{ font-size:18px; margin:0; line-height:1.28; }
  .card .hook{ font-size:13px; color: rgba(26,26,46,0.72); line-height:1.45; margin:0; flex-grow:1; }
  .explore-row{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; font-family:'Fredoka',sans-serif; opacity:.75; margin-top:auto; }
  .explore-row svg{ transition: transform .15s ease; }
  .card:hover .explore-row svg{ transform: translateX(3px); }

  .squinting .grid{ filter: blur(6px); transition: filter .4s ease; }
  .squinting .card:hover{ filter: blur(0); }

  .empty-state{ text-align:center; padding: 50px 20px; color:var(--ink-soft); }

  .modal-overlay{
    position:fixed; inset:0; background: rgba(26,26,46,0.55);
    display:flex; align-items:flex-start; justify-content:center;
    padding: 5vh 20px; z-index:100; overflow-y:auto;
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal{
    background: var(--paper); border:2px solid var(--ink); border-radius:20px;
    max-width: 680px; width:100%; padding: 30px 30px 26px;
    box-shadow: var(--shadow-lg);
    animation: popIn .18s cubic-bezier(.3,.4,.3,1.3);
  }
  @keyframes popIn{ from{ transform:translateY(10px) scale(.98); opacity:0;} to{ transform:none; opacity:1;} }
  .modal-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:6px;}
  .modal-close{
    background:var(--line); border:2px solid var(--ink); border-radius:10px;
    width:36px; height:36px; font-size:16px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ background:var(--laws); color:white; }
  .modal h2{ font-size: 26px; margin: 4px 0 4px; line-height:1.2; }
  .modal .modal-hook{ font-size:14.5px; color:var(--ink-soft); font-style:italic; margin: 0 0 20px; }

  .section-label{
    display:flex; align-items:center; gap:7px;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:13.5px;
    text-transform:uppercase; letter-spacing:.03em; margin: 20px 0 8px;
    color: var(--ink);
  }
  .section-label:first-of-type{ margin-top:4px; }
  .modal p.body-text{ font-size:15px; line-height:1.62; margin:0; color:var(--ink); }
  .modal p.body-text.small{ font-size:13.5px; line-height:1.55; }

  .points-list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; }
  .points-list li{ font-size:14.5px; line-height:1.55; }
  .points-list .point-intro{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px;
    color: var(--ink); margin: 2px 0 -2px;
  }
  .points-list .point-plain{
    position:relative; padding-left:20px;
  }
  .points-list .point-plain::before{
    content:"—"; position:absolute; left:0; top:0; color: var(--ink-soft); font-weight:600;
  }
  .points-list .point-term{
    background: var(--bg); border:1.5px solid var(--line); border-radius:10px;
    padding:10px 14px; list-style:none;
  }
  .points-list .point-term .point-term-label{
    display:block; font-family:'Fredoka',sans-serif; font-weight:600; font-size:13.5px;
    margin-bottom:2px; color: var(--ink);
  }
  .modal[data-cat="laws"] .point-term .point-term-label{ color: var(--laws-dark); }
  .modal[data-cat="mech"] .point-term .point-term-label{ color: var(--mech-dark); }
  .modal[data-cat="vis"] .point-term .point-term-label{ color: var(--vis-dark); }
  .modal[data-cat="beh"] .point-term .point-term-label{ color: var(--beh-dark); }
  .modal[data-cat="strat"] .point-term .point-term-label{ color: var(--strat-dark); }
  .modal[data-cat="access"] .point-term .point-term-label{ color: var(--access-dark); }

  .section-label.small{ font-size:12px; margin: 0 0 6px; }
  .two-col{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin: 18px 0 4px;
  }
  .two-col-item{
    background: var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  @media (max-width: 560px){
    .two-col{ grid-template-columns: 1fr; }
  }
  .example-list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; }
  .example-list li{
    font-size:14px; line-height:1.55; padding:11px 14px; border-radius:10px;
    background: var(--bg); border:1.5px solid var(--line); position:relative; padding-left:32px;
  }
  .example-list li::before{ content:"✓"; position:absolute; left:11px; top:11px; font-weight:700; color: var(--mech-dark); }
  .watch-box{
    background: var(--laws-tint); border:1.5px solid rgba(178,58,58,0.35);
    border-radius:10px; padding:12px 14px; font-size:13.5px; line-height:1.55;
  }
  .watch-box strong{ color: var(--laws-dark); }

  .scenario-wrap{ padding-bottom: 34px; }
  .progress-row{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .progress-track{ flex:1; height:10px; background:var(--line); border-radius:6px; overflow:hidden; border:2px solid var(--ink);}
  .progress-fill{ height:100%; background: var(--beh); transition: width .35s ease; }
  .score-chip{
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px;
    border:2px solid var(--ink); border-radius:8px; padding:5px 10px; white-space:nowrap;
  }

  .scenario-card{
    border:2px solid var(--ink); border-radius:18px; padding:26px;
    background: linear-gradient(180deg, #fff, #FCFCFF);
    box-shadow: var(--shadow-lg);
  }
  .scenario-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
  .scenario-text{ font-size:18px; line-height:1.5; margin: 0 0 22px; }
  .options{ display:grid; gap:10px; }
  .option-btn{
    text-align:left; padding:14px 16px; border-radius:12px; border:2px solid var(--ink);
    background:var(--paper); font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:14.5px;
    cursor:pointer; transition: transform .1s ease;
  }
  .option-btn:hover:not([disabled]){ transform: translateX(3px); }
  .option-btn[disabled]{ cursor:default; }
  .option-btn.incorrect{ background:#FFE3E3; border-color:#D14343; }
  .option-btn.reveal-correct{ background:#DFF6E6; border-color:#2F9E52; }

  .feedback-box{
    margin-top:18px; padding:16px 18px; border-radius:12px; border:2px dashed var(--ink);
    font-size:13.5px; line-height:1.5; background: var(--strat-tint);
  }
  .feedback-box strong{ font-family:'Fredoka',sans-serif; }

  .next-btn{
    margin-top:18px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:14.5px;
    background: var(--ink); color:white; border:2px solid var(--ink); border-radius:12px;
    padding:12px 20px; cursor:pointer; box-shadow: var(--shadow);
  }
  .next-btn:active{ transform: translateY(2px); box-shadow:none; }

  .results{ text-align:center; padding: 30px 10px 10px; }
  .results h2{ font-size:26px; margin-bottom:6px;}
  .big-score{ font-family:'Fredoka',sans-serif; font-size:56px; margin: 10px 0; }
  .breakdown{ display:grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin: 22px 0; text-align:left; }
  .bd-item{ border:2px solid var(--ink); border-radius:12px; padding:12px 14px; }
  .bd-item .n{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;}
  .restart-btn{
    font-family:'Fredoka',sans-serif; font-weight:600; background:var(--beh); color:white;
    border:2px solid var(--ink); border-radius:12px; padding:13px 24px; cursor:pointer;
    box-shadow: var(--shadow); font-size:15px;
  }
  .restart-btn:active{ transform: translateY(2px); box-shadow:none; }

  .missed-list{ text-align:left; margin-top:18px; }
  .missed-item{ border-left:4px solid var(--laws); background:var(--laws-tint); border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:13px; }

  footer{ text-align:center; color:var(--ink-soft); font-size:12px; margin-top:30px; }

  @media (max-width: 600px){
    .brand-text h1{ font-size:22px; }
    .modal{ padding:22px 20px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
      <circle cx="21" cy="21" r="16" fill="#FFB627" stroke="#1A1A2E" stroke-width="2.5"/>
      <circle cx="16" cy="19" r="2.6" fill="#1A1A2E"/>
      <circle cx="26" cy="19" r="2.6" fill="#1A1A2E"/>
      <path d="M15 27c2.5 2.5 8 2.5 11 0" stroke="#1A1A2E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <rect x="31" y="31" width="14" height="5" rx="2.5" transform="rotate(45 31 31)" fill="#1A1A2E"/>
    </svg>
    <div class="brand-text">
      <h1>UIUX Principles</h1>
      <p>Laws, mechanics &amp; psychology — for every kind of Product Manager</p>
    </div>
  </div>
  <button class="squint-btn" id="squintBtn">
    <span id="squintIcon">👀</span> <span id="squintLabel">Squint Test</span>
  </button>
</header>

<div class="tabbar">
  <div class="tab active" data-view="library">📚 Reference Library</div>
  <div class="tab" data-view="scenarios">🎯 Scenario Practice</div>
</div>

<main id="main"></main>

<footer>Built from your UI/UX source notes — click any card to open its full explanation, or try Squint Test mode to feel the visual-hierarchy principle in action.</footer>

<div id="modalRoot"></div>

<script>
const CATS = {
  laws:  { label: "Fundamental Laws",      icon: "⚖️" },
  mech:  { label: "Interaction Mechanics",  icon: "⚙️" },
  vis:   { label: "Visual & Cognitive",     icon: "👁️" },
  beh:   { label: "Behavioral Psychology",  icon: "🧠" },
  strat: { label: "Strategic Frameworks",   icon: "🧭" },
  access:{ label: "Accessibility",          icon: "♿" },
};

const PLATFORMS = {
  both:   { label: "Web + Mobile", icon: "🔁" },
  web:    { label: "Web",          icon: "🌐" },
  mobile: { label: "Mobile",       icon: "📱" },
};

const PRINCIPLES = [
  {cat:"laws", platform:"both", name:"Don't Make Me Think", hook:"Self-evidence beats explanation.",
    def:"The overriding law of usability: a screen or flow should be obvious enough that a user of average ability can figure out what it is and how to use it without expending real mental effort. Every unresolved question in a user's head, is that a button, where am I, what happens if I click this, quietly drains their patience and increases the chance they abandon the task before finishing it.",
    why:"Every moment a user spends puzzling over an interface is a moment of doubt — and doubt compounds. Each unresolved question quietly taxes their patience, and enough of them add up to task abandonment, even if any single confusion seemed minor.",
    points:[{"text":"A screen should be self-evident — obvious enough that an average user needs zero real effort to understand what it is and how to use it."},{"text":"Every unresolved question — is that a button? what happens if I click this? — quietly drains patience."},{"text":"Enough small doubts compound into task abandonment, even when no single confusion felt like a big deal."}],
    when:"Apply it whenever you're reviewing any screen a first-time or occasional user will land on, especially entry points like onboarding, checkout, or a new feature's first use, where there's no accumulated familiarity to fall back on.",
    how:"Read your own screen as a total stranger would: for every element, ask 'would an average person instantly know what this is and what happens if they interact with it?' If you have to explain it out loud, rewrite the label, the layout, or the copy until you don't have to.",
    example:[
      "A checkout button labeled 'Place Order — $42.00' beats a vague 'Continue', because the user never has to guess the consequence of clicking.",
      "Amazon's 'Buy Now' vs. 'Add to Cart' are visually distinct precisely because they lead to very different outcomes — the labels remove any doubt."
    ],
    watch:"Don't confuse this with 'dumbing down' a product — it's about removing unnecessary ambiguity, not removing genuine functionality or depth."},

  {cat:"laws", platform:"both", name:"Clarity Trumps Consistency", hook:"Break the pattern when it helps.",
    def:"Consistency is a good default because it lets people transfer what they've learned from one screen to the next. But when strict consistency would make something confusing, a design should prioritize clarity instead, even at the cost of matching the rest of the system exactly.",
    why:"Rigid consistency exists to reduce learning cost, but it becomes counterproductive the moment it forces an important action to look just like everything else and get lost in the crowd.",
    points:[{"text":"Consistency is the default — it lets people reuse what they've already learned elsewhere in your product."},{"text":"But when strict consistency would create real confusion, prioritize clarity instead — even at the cost of breaking the pattern."}],
    when:"Reach for this only when a specific element carries outsized consequence or risk — a destructive action, an unusually important choice — and your existing design system would otherwise camouflage it.",
    how:"Ask 'does deviating here make the user safer or faster, or am I just breaking pattern for novelty's sake?' If it's the former, deviate deliberately and document why, so the exception doesn't quietly become permission to break consistency everywhere.",
    example:[
      "Using a red icon for 'delete' even though the rest of your icon system is neutral-colored, because the color instantly signals danger.",
      "A 'Save & Exit' button that looks different from every other secondary button on the page, because it triggers an unusually consequential action."
    ],
    watch:"This is an exception, not a license — inconsistency should be rare and deliberate, or your design system stops meaning anything."},

  {cat:"laws", platform:"both", name:"Krug's Second Law (Mindless Clicks)", hook:"Clicks are free if they're obvious.",
    def:"The number of clicks it takes to reach a goal matters far less than whether each individual click is an unambiguous, mindless choice. A 5-click path where every step is obvious beats a 2-click path where the user has to stop and think at each one.",
    why:"Teams often optimize the wrong metric — minimizing click count — when what actually drives abandonment is decision difficulty at each step, not the number of steps itself.",
    points:[{"text":"Click count matters far less than whether each individual click is an obvious, mindless choice."},{"text":"A 5-click path where every step is obvious beats a 2-click path that makes you stop and think."}],
    when:"Use this when deciding whether to break a complex task into multiple simple screens versus cramming it onto one dense screen, especially during checkout flows, onboarding, or multi-field forms.",
    how:"For each proposed click, ask 'is this an obvious, low-stakes choice, or does it require the user to stop and think?' Favor more obvious clicks over fewer ambiguous ones, and test with someone unfamiliar with the flow to see where they hesitate.",
    example:[
      "A 3-step signup wizard with clearly labeled steps outperforms a single cramped page packed with 12 ambiguous fields.",
      "IKEA's website funnels you through category, then subcategory, then product with obvious labels at every step, rather than one giant confusing filter panel."
    ],
    watch:"This counters the common myth that 'fewer clicks always wins' — click count is the wrong metric; decision difficulty is the right one."},

  {cat:"laws", platform:"both", name:"Fitts's Law", hook:"Distance + size = speed.",
    def:"The time it takes to move a pointer or thumb to a target is a function of the distance to that target and its size — closer and bigger means faster and more accurate. Screen edges and corners act as effectively infinite targets, since the cursor physically cannot overshoot past them.",
    why:"Interaction speed and error rate are physically constrained by geometry — a target's size and its distance from the user's current point of focus directly determine how quickly and accurately it can be reached.",
    points:[{"text":"Reaching a target is a function of two things: how far away it is, and how big it is."},{"text":"Screen edges and corners act as effectively 'infinite' targets — the cursor physically can't overshoot past them."}],
    when:"Apply it when placing or sizing any interactive element a user will reach for repeatedly or urgently — primary buttons, frequently used icons, and anything on a touchscreen where fingers are less precise than a mouse cursor.",
    how:"Make frequent or high-value targets large and close to where attention already sits; push edges and corners to their advantage since they're effectively infinite; and give small icons generous invisible tap-target padding rather than shrinking the interaction zone to match the visible icon.",
    example:[
      "macOS puts window controls and the menu bar right at the screen's edge — you can't overshoot past the boundary, so they're always easy to hit.",
      "Mobile apps enlarge the tap target around a small icon, say 44 by 44 pixels, even if the icon itself looks smaller, to make it easier to hit accurately."
    ],
    watch:"Applies to distance from the user's current focus, not just raw pixel size — a huge button far from where the eye or cursor already is can still feel slow to reach."},

  {cat:"laws", platform:"both", name:"Hick's Law", hook:"More choices, slower decisions.",
    def:"The time it takes someone to make a decision increases with the number and complexity of the choices in front of them. Reducing the visible option count, or organizing options into categories, lets users eliminate large chunks of the decision at once instead of scanning every option individually.",
    why:"Decision-making time doesn't scale linearly with options — every additional choice adds real cognitive overhead, and unstructured long lists are one of the most common silent sources of task abandonment.",
    points:[{"text":"Decision time increases with the number and complexity of choices in front of someone."},{"text":"Reducing visible options, or grouping them into categories, lets people eliminate large chunks at once instead of scanning one by one."}],
    when:"Use it when a screen presents many options at once — dropdowns, navigation menus, filter panels, or any list a user must scan to pick one item.",
    how:"Reduce the number of visible options where possible, or bucket them into clear categories so users can eliminate large chunks at once instead of scanning one by one; surface only the most common choices by default and let advanced options live one layer deeper.",
    example:[
      "A 50-country dropdown feels instant once it's grouped by continent instead of presented as one giant alphabetical list.",
      "Restaurant menus with a handful of curated chef's picks at the top reduce decision fatigue compared to a 60-item unstructured list."
    ],
    watch:"Don't over-apply this to remove genuinely useful options — advanced or power users often need the full choice set available somewhere, just not on the default path."},

  {cat:"laws", platform:"both", name:"Tesler's Law (Conservation of Complexity)", hook:"Complexity doesn't vanish — it moves.",
    def:"Every product has a certain amount of complexity that is inherent to the problem it solves and simply cannot be eliminated. The designer's real job isn't to remove that complexity, but to decide who absorbs it, and to shift as much of it as possible from the user onto the software itself.",
    why:"Because complexity can't be deleted, only relocated, ignoring this law usually means a team unconsciously dumps unnecessary complexity onto the user simply because handling it in software would take more engineering time.",
    points:[{"text":"Every product carries some complexity that's inherent to the problem it solves — it can't be removed, only relocated."},{"text":"The designer's real job is to decide who absorbs that complexity, and shift as much of it as possible from the user onto the software."}],
    when:"Apply it during any workflow or form design decision where the system already has information that could spare the user a manual step — data entry, configuration, or repetitive multi-field input.",
    how:"For every manual step you ask a user to do, ask 'could the software infer, pre-fill, or automate this instead?' If yes, weigh the added engineering cost against the ongoing user cost it removes — often it's worth it, especially for high-frequency actions.",
    example:[
      "Auto-detecting a credit card type, Visa, Amex, or Mastercard, from its number instead of making the user select it manually.",
      "A tax filing app that pre-fills known figures from a W-2 upload rather than asking the user to type every field by hand."
    ],
    watch:"Shifting complexity to the software usually means more engineering effort behind the scenes — this principle has real cost trade-offs, not just design ones."},

  {cat:"laws", platform:"both", name:"Poka-Yoke (Error-Proofing)", hook:"Design so mistakes can't happen.",
    def:"Systems should be designed to prevent human error before it happens, and where prevention isn't possible, to make the error easy to spot and undo. This borrows directly from manufacturing, where physical jigs are shaped so a part can only be assembled the correct way.",
    why:"Preventing an error costs far less, in trust, support tickets, and lost data, than fixing one after the fact, and some errors (like accidental deletion) simply can't be fully undone.",
    points:[{"text":"Prevent human error before it happens — or, at minimum, make mistakes easy to spot and undo."},{"text":"Borrowed from manufacturing, where a physical jig is shaped so a part can only be assembled the one correct way."}],
    when:"Apply it to any irreversible, destructive, or high-consequence action — deleting data, submitting a payment, sending something publicly — where a single accidental click causes real harm.",
    how:"Add friction proportional to the action's risk: confirmation dialogs, typed confirmation phrases, disabled states until preconditions are met, or an undo window after the fact. Reserve heavier guards for genuinely risky actions so you don't over-friction routine ones.",
    example:[
      "A 'Delete Account' action that stays disabled until the user types the word DELETE, preventing an accidental single click from destroying data.",
      "A form that disables the 'Submit' button and shows an inline warning until every required field is validly filled."
    ],
    watch:"There's a balance between error-proofing and adding friction — over-guarding low-risk actions, like sending a normal email, can frustrate users more than it protects them."},

  {cat:"mech", platform:"both", name:"Discoverability", hook:"Can users find what's possible?",
    def:"A design must let users determine, at a glance, what actions are actually available to them and understand what state the system is currently in. Powerful features that are invisible or unlabeled might as well not exist for the vast majority of users.",
    why:"A feature that exists but that users can't find is functionally equivalent to a feature that was never built — all the engineering investment behind it delivers zero value if nobody discovers it.",
    points:[{"text":"Users must be able to tell, at a glance, what actions are available and what state the system is currently in."},{"text":"A powerful feature that's invisible or unlabeled might as well not exist for the vast majority of users."}],
    when:"Apply it whenever you introduce any non-obvious interaction — a gesture, a keyboard shortcut, a hidden menu, or any powerful feature that isn't represented by a visible, labeled control.",
    how:"Pair novel interactions with a visible entry point or a one-time hint the first time a user might benefit from it (a tooltip, a subtle animation, an empty-state prompt), and periodically audit your product for features that quietly went undiscovered by real users in session recordings or analytics.",
    example:[
      "A swipe-to-archive gesture in an email app is easy to miss entirely unless it's paired with a brief onboarding hint the first time.",
      "Right-click context menus hide useful actions from users who never think to right-click — surfacing key ones as visible buttons improves discoverability."
    ],
    watch:"Novel interactions, gestures, keyboard shortcuts, almost always need a visible entry point or hint the first time, or most users will simply never find them."},

  {cat:"mech", platform:"both", name:"The UI Stack (Five States)", hook:"Every screen has 5 lives.",
    def:"Every screen in a product needs to be explicitly designed for five distinct states, not just the happy path: the Ideal state, full of useful content, the Empty or Blank state, before any data exists, the Error state, something went wrong, the Partial state, some but not all content is present, and the Loading state, data is being fetched.",
    why:"Teams naturally design and demo the Ideal state because it looks the best in a portfolio or pitch — but real users spend enormous amounts of time in the other four states, and neglecting them creates jarring, broken-feeling moments in the actual product.",
    points:[{"text":"Every screen needs an explicit design for five distinct states — not just the happy path:"},{"term":"Ideal","text":"full of useful, actionable content"},{"term":"Empty / Blank","text":"the first-time experience, before any data exists yet"},{"term":"Error","text":"something has gone wrong"},{"term":"Partial","text":"some content exists, but not the full picture yet"},{"term":"Loading","text":"data is currently being fetched"}],
    when:"Apply it at the start of designing any new screen or feature, not as an afterthought — plan for all five states before a single pixel of the 'happy path' is finalized.",
    how:"For every screen, explicitly sketch or wireframe: what a first-time user with zero data sees (Empty), what a partially-populated screen looks like (Partial), what happens when something fails (Error), what the user sees while waiting (Loading), and only then, the fully-populated (Ideal) version.",
    example:[
      "An empty inbox that says 'You're all caught up' with an illustration, instead of just a blank white screen with no explanation.",
      "A dashboard with only one data point yet, the Partial state, shows a subtle prompt suggesting the next action to unlock more insight."
    ],
    watch:"Teams often design and test only the Ideal state, then discover the Empty and Error states were never designed at all once the product ships."},

  {cat:"mech", platform:"both", name:"Feedback", hook:"Every action deserves a reaction.",
    def:"Every action a user takes should be met with a clear, immediate signal that the system registered it. Without feedback, users are left wondering whether their click worked, and will often click again, sometimes triggering the action twice.",
    why:"Without a clear signal that an action registered, users are left uncertain whether their input worked at all — and uncertainty commonly leads to repeated actions, like double-submitting a form, or to users abandoning the task assuming it failed.",
    points:[{"text":"Every action a user takes should be met with a clear, immediate signal that the system registered it."},{"text":"Without that signal, users second-guess whether their click worked — and often click again, sometimes triggering the action twice."}],
    when:"Apply it to every interactive element a user can act on, but especially anything with a delay (uploads, saves, network calls) or anything with real consequence (payments, deletions, submissions).",
    how:"Match the intensity of the feedback to the stakes of the action: a subtle hover or color change is enough for minor actions, while consequential actions deserve an explicit confirmation message, and anything with a delay needs a progress indicator so users know the system hasn't stalled.",
    example:[
      "A button that briefly shows a checkmark and the text 'Saved!' after being clicked, instead of just going quiet.",
      "A file upload that shows a progress bar and percentage, rather than a static screen with no indication anything is happening."
    ],
    watch:"Feedback needs to be proportional — a tiny visual change is enough for a minor action, but a destructive or high-stakes action deserves a much clearer confirmation."},

  {cat:"mech", platform:"both", name:"Affordances & Signifiers", hook:"What it does vs. what tells you that.",
    def:"An affordance is the actual possible interaction an object offers, a button affords clicking, a slider affords dragging. A signifier is the visual cue that communicates that affordance exists in the first place, like a shadow, bevel, or underline. A control can have an affordance with no signifier, hidden functionality, or a signifier with no real affordance, a fake-looking button that does nothing.",
    why:"An affordance without a signifier is invisible functionality nobody will find, and a signifier without a real affordance is a false promise that erodes trust the moment a user clicks something that looks interactive but isn't.",
    points:[{"term":"Affordance","text":"the actual interaction an object offers — a button affords clicking, a slider affords dragging"},{"term":"Signifier","text":"the visual cue that tells you the affordance exists — a shadow, a bevel, an underline"},{"text":"A control can have an affordance with no signifier (hidden functionality), or a signifier with no real affordance (a fake-looking button that does nothing)."}],
    when:"Apply this whenever you're deciding how an interactive element should look, especially in minimalist or 'flat' design systems where visual cues are often stripped away for aesthetics.",
    how:"For every control, deliberately choose a visual signifier, shadow, underline, color, cursor change, that matches its real affordance, and periodically audit your interface for elements that look clickable but aren't, or are clickable but don't look it.",
    example:[
      "A raised, shadowed button, the signifier, tells you it's clickable, the affordance, before you ever try interacting with it.",
      "Underlined blue text signifies 'this is a link' even though technically any text could theoretically be made clickable."
    ],
    watch:"Flat design trends often strip away signifiers, shadows, borders, for a cleaner look, which can accidentally hide real affordances from users."},

  {cat:"mech", platform:"both", name:"Mappings", hook:"Controls should move like their results.",
    def:"The relationship between a control and the effect it produces should follow a natural, intuitive spatial analogy, so the direction of the interaction matches the direction of the outcome. When mappings are unnatural, users have to consciously translate the control's motion into its effect, adding friction.",
    why:"When a control's motion doesn't match its effect, users have to consciously translate the interaction rather than acting on instinct, adding friction and increasing the chance of mistakes, especially under time pressure.",
    points:[{"text":"A control's effect should follow a natural spatial analogy — the direction of the interaction should match the direction of the outcome."},{"text":"When mappings are unnatural, people have to consciously translate motion into effect, which adds friction to every use."}],
    when:"Apply it whenever designing any control with a directional or spatial quality — sliders, dials, drag interactions, or any layout where a physical control corresponds to an on-screen or real-world result.",
    how:"Default to well-established spatial conventions (up increases, right advances, dragging matches direction of effect) unless you have a strong, tested reason to deviate, and validate any non-obvious mapping with real users before shipping it broadly.",
    example:[
      "Dragging a volume slider upward increases the volume — the physical motion of the drag matches the outcome.",
      "On a stovetop, if the burner layout mirrors the knob layout, front-left knob controls front-left burner, the mapping is obvious without a label."
    ],
    watch:"Mappings can be culturally dependent — 'up means more' is common, but not every interaction has an equally universal spatial analogy."},

  {cat:"mech", platform:"mobile", name:"Ergonomics & the Thumb Zone", hook:"Design for the hand, not just the eye.",
    def:"Mobile interfaces should account for the thumb zone, a heat map of which areas of the screen are comfortable to reach one-handed versus which require an awkward stretch or a second hand. Primary, frequent actions belong in the easy zone; rare or destructive actions can sit further away.",
    why:"On mobile, physical reach constraints are just as real as visual or cognitive ones — a button that's visually perfect but physically awkward to reach one-handed will still get missed, mis-tapped, or avoided.",
    points:[{"text":"Mobile layouts should map to the thumb zone — the areas of a screen that are comfortable to reach one-handed."},{"text":"Frequent, primary actions belong in the easy-reach zone; rare or destructive ones can sit further away."}],
    when:"Apply it to any mobile-first interface, especially frequently used primary actions, navigation, and anything users are likely to reach for one-handed while multitasking.",
    how:"Place your most frequent, highest-value actions in the easy-reach lower-center zone of the screen; push rare or destructive actions further away or behind an extra confirmation step; and test your layout by actually holding a phone one-handed rather than only reviewing it on a desktop mockup.",
    example:[
      "Most mobile apps place primary navigation and key actions along the bottom edge of the screen, not the top, since thumbs reach down more easily than up.",
      "A back gesture from the left edge of the screen is easier for most right-handed grip patterns than a tiny top-left back arrow."
    ],
    watch:"Screen sizes and hand sizes vary a lot — the thumb zone is a strong heuristic, not a guarantee for every single user or device."},

  {cat:"vis", platform:"both", name:"Visual Hierarchy", hook:"Importance should be visible, not implied.",
    def:"Visual cues, size, weight, color, and position, must communicate the relative importance of elements on a screen. The more important something is, the more visually prominent it should be, and logically related items should be grouped together so relationships are obvious without reading a word of copy.",
    why:"Without a deliberate hierarchy, every element competes equally for attention, and the user is forced to do the sorting work themselves, guessing what matters instead of instantly perceiving it.",
    points:[{"text":"Size, weight, color, and position should signal relative importance — the more important something is, the more visually prominent it should be."},{"text":"Logically related items should be grouped together, so relationships are obvious without reading a word of copy."}],
    when:"Apply it any time a screen presents more than one piece of information or one possible action — which is to say, on almost every screen you design.",
    how:"Decide the single most important thing on the screen first, then deliberately make it the largest, boldest, or most colorful element, and dial everything else down in relative prominence; group related items visually so their relationship is obvious without needing a label.",
    example:[
      "A pricing page where the recommended plan is visually larger, has a colored border, and sits in the center — pulling the eye there first.",
      "A dashboard headline metric is rendered in a huge bold number, while supporting context sits in small gray text beneath it."
    ],
    watch:"If every element is made 'important', bold, colored, large, none of them actually stand out — hierarchy requires genuine trade-offs, not just decoration."},

  {cat:"vis", platform:"both", name:"Scanning vs. Reading", hook:"Users scan. Design for skimmers.",
    def:"Users very rarely read a page top to bottom, word for word, instead, they scan for keywords, patterns, and visual landmarks that match what they're looking for. Designs should support scanning behavior with large fonts, generous white space, bulleted lists, and short paragraphs rather than dense blocks of text.",
    why:"Designing as though users will read every word leads to dense, intimidating screens that get skipped entirely — supporting scanning behavior instead means the key information gets through even to someone giving the page five seconds of attention.",
    points:[{"text":"People rarely read a page top to bottom, word for word — they scan for keywords, patterns, and visual landmarks."},{"text":"Support that with large fonts, generous white space, bullet points, and short paragraphs — not dense blocks of text."}],
    when:"Apply it to any content-heavy screen — landing pages, feature descriptions, settings panels, documentation — where users are likely to skim rather than commit to full reading.",
    how:"Break long paragraphs into short ones or bullet points, bold the specific phrases that carry the core meaning, and add generous white space so the eye has natural resting points; reserve dense full-paragraph text only for content that genuinely requires careful reading, like legal or medical instructions.",
    example:[
      "Bolding key phrases within a paragraph so a skimming eye still catches the main point even without reading every word.",
      "Breaking a long feature description into 3 short bullet points instead of one dense paragraph."
    ],
    watch:"Scannability shouldn't come at the cost of removing necessary nuance — some content, legal terms, medical instructions, genuinely needs full reading, and should be flagged as such."},

  {cat:"vis", platform:"both", name:"Pattern Recognition & Mental Models", hook:"Users expect what they've seen before.",
    def:"The brain naturally looks for patterns, even where none technically exist, and users carry mental models, expectations, built from prior experience across many other products, of where things like a search bar, a logo, or a shopping cart icon should be.",
    why:"Users don't approach your product as a blank slate — they arrive with expectations built from every other product they've used, and violating those expectations forces them to consciously relearn something that should have been automatic.",
    points:[{"text":"The brain naturally looks for patterns, even where none technically exist."},{"text":"Users carry mental models — expectations built from every other product they've used — about where things like a search bar or a logo 'should' be."}],
    when:"Apply it when deciding where to place common, universally-expected elements — navigation, search, logo, cart icon — and be cautious about breaking convention purely for the sake of visual novelty.",
    how:"Default to established conventions for common elements unless you have strong evidence a deviation genuinely improves the experience, and if you do break a mental model, make the new pattern obviously discoverable to offset the unlearning cost.",
    example:[
      "Putting the logo top-left and linking it back to the homepage, because that's the mental model almost every web user already carries.",
      "A shopping cart icon in the top-right corner of an e-commerce site, because that convention is now nearly universal."
    ],
    watch:"Breaking a strong existing mental model, like moving the cart icon to an unexpected location, usually costs more in confusion than it gains in novelty."},

  {cat:"vis", platform:"both", name:"The Squint Test", hook:"Blur it to find what stands out.",
    def:"A quick evaluation technique where a designer squints at, or blurs, an interface to strip away fine detail, revealing whether the visual hierarchy is strong enough that the truly important elements remain identifiable even at a glance.",
    why:"It's a fast, low-cost way to catch a weak visual hierarchy before investing in full usability testing — if the important elements don't survive having their fine detail stripped away, no amount of polish elsewhere will fix that underlying structural problem.",
    points:[{"text":"Squint at, or blur, an interface to strip away its fine detail."},{"text":"If the truly important elements are still identifiable through the blur, the visual hierarchy is strong enough."}],
    when:"Apply it near the end of any visual design pass, as a quick sanity check before moving to detailed testing or before shipping a design to engineering.",
    how:"Literally squint at your screen, or blur it in a design tool, and note what still stands out. If your primary action or key message doesn't survive the blur, increase its size, contrast, or isolation from surrounding elements until it does.",
    example:[
      "Squinting at a landing page — if the primary CTA button doesn't still visually pop out from the rest of the blur, its hierarchy is too flat.",
      "Try the Squint Test toggle at the top of this app: it blurs this entire grid, and only the card you hover sharpens back into focus."
    ],
    watch:"It's a fast sanity check, not a replacement for real usability testing with actual users and tasks."},

  {cat:"vis", platform:"both", name:"Cognitive Load (Cognitive / Visual / Motor)", hook:"Thinking costs more than clicking.",
    def:"Users spend three distinct kinds of resources when using a product: cognitive load, thinking and remembering, visual load, looking and searching, and motor load, clicking, tapping, or moving. Of the three, cognitive load is generally the most mentally expensive, which is why it's often worth adding an extra click if it removes the need to recall or calculate something.",
    why:"Not all effort is equal — asking someone to remember or calculate something is mentally far more taxing than asking them to make an extra click, so optimizing purely for fewer clicks can actually make an experience feel harder, not easier.",
    points:[{"text":"Using a product spends three distinct kinds of resources:"},{"term":"Cognitive load","text":"thinking and remembering"},{"term":"Visual load","text":"looking and searching"},{"term":"Motor load","text":"clicking, tapping, or moving"},{"text":"Cognitive load is generally the most expensive of the three — which is why it's often worth an extra click if it removes the need to recall or calculate something."}],
    when:"Apply it whenever a user needs to recall information, do mental math, or keep multiple things in their head at once to complete a task — data entry, configuration, or any multi-step process with dependencies between steps.",
    how:"Replace recall-based interactions (blank text fields requiring the user to remember exact values or formats) with recognition-based ones (dropdowns, autocomplete, pre-filled defaults) wherever the added click is cheaper than the mental effort it saves.",
    example:[
      "An autocomplete address field beats a blank text field, because recognizing a listed suggestion is cognitively cheaper than recalling the exact correct format.",
      "A dropdown of pre-set shipping options is easier than a free-text field asking users to type their preferred delivery speed."
    ],
    watch:"Adding clicks isn't free either — this trade-off only works when the click meaningfully reduces thinking, not when it's just extra navigation."},

  {cat:"beh", platform:"both", name:"The Hook Model", hook:"Trigger → Action → Reward → Investment.",
    def:"A four-phase cycle used to design habit-forming products: an external or internal Trigger prompts the user, a simple Action follows in anticipation of a reward, a Variable Reward satisfies the underlying need while leaving the user wanting more, and an Investment, some small effort put into the product, increases its value to the user and quietly sets up the next trigger.",
    why:"Understanding this loop lets a PM diagnose exactly which stage of a product's engagement is broken — weak retention is rarely one vague problem, it's usually a specific missing trigger, an unrewarding action, or a reward that fails to leave the user wanting more.",
    points:[{"text":"A four-phase cycle for designing habit-forming products:"},{"term":"Trigger","text":"an external or internal prompt that starts the cycle"},{"term":"Action","text":"the simplest behavior done in anticipation of a reward"},{"term":"Variable Reward","text":"satisfies the need, but leaves the user wanting more"},{"term":"Investment","text":"a small effort that raises the product's value and quietly sets up the next trigger"}],
    when:"Apply it when designing or diagnosing any feature meant to build a recurring habit — notifications, streaks, feeds, or anything intended to bring users back repeatedly rather than being used once.",
    how:"Map your existing feature onto all four phases explicitly (Trigger, Action, Variable Reward, Investment) and look for the weakest link; strengthen it specifically rather than making vague general improvements, and use ethical judgment about when habit formation crosses into manipulation.",
    example:[
      "Duolingo: a push notification, trigger, leads to opening the app for one lesson, action, followed by a satisfying streak animation, variable reward, then the growing streak count itself, investment, which becomes tomorrow's reason to return.",
      "Instagram: a notification badge, trigger, leads to opening the feed, action, an unpredictable mix of interesting and mundane posts, variable reward, then liking and following more accounts, investment."
    ],
    watch:"This model is explicitly about habit formation — used irresponsibly, it can produce compulsive rather than genuinely valuable engagement, which is a real ethical consideration for PMs."},

  {cat:"beh", platform:"both", name:"Fogg Behavior Model (B=MAT)", hook:"Motivation × Ability × Trigger, all at once.",
    def:"A behavior only occurs when sufficient Motivation, sufficient Ability, and a well-timed Trigger all converge at the exact same moment. If any one of the three is missing or too weak, the behavior won't happen, and increasing a user's Ability, making the task easier, is usually the highest-leverage, most reliable lever to pull, since motivation is harder to manufacture.",
    why:"It gives a precise diagnostic instead of a vague one — when a desired behavior isn't happening, this model forces you to identify specifically whether Motivation, Ability, or Trigger is the actual missing ingredient, rather than guessing.",
    points:[{"text":"A behavior only happens when all three of these converge at the exact same moment:"},{"term":"Motivation","text":"the user genuinely wants the outcome"},{"term":"Ability","text":"the task is easy enough to actually do"},{"term":"Trigger","text":"something prompts the action right now"},{"text":"If any one is missing, the behavior won't happen — and increasing Ability is usually the highest-leverage, most reliable lever to pull."}],
    when:"Apply it whenever an intended user behavior has low adoption despite people seemingly wanting the outcome — feature adoption, onboarding completion, or any action with a suspiciously low conversion rate.",
    how:"Diagnose in order: is there a trigger at all? Is the user actually motivated? Is the task easy enough given their current motivation level? Since increasing Ability, simplifying the task, is usually cheaper and more reliable than trying to manufacture more motivation, start there.",
    example:[
      "Users want to update their profile photo, motivation, but the upload flow is buried four menus deep, low ability, so almost no one does it.",
      "A one-tap 'reorder' button on a food delivery app succeeds because it removes almost all the ability barrier for an already-motivated, already-triggered user."
    ],
    watch:"Don't default to 'we need more motivation', bigger incentives, louder messaging, when the real blocker is usually Ability — that's the cheaper and more reliable fix."},

  {cat:"beh", platform:"both", name:"The CREATE Action Funnel", hook:"Six gates before a conscious action.",
    def:"A more granular model for deliberate, non-habitual actions, unlike the Hook Model, which is about automatic habits. A user must pass through six sequential mental gates before acting: Cue, notice something, Reaction, a gut response, Evaluation, is it worth it, Ability, can I actually do it, Timing, is now the moment, and Experience, was doing it actually good, shaping future behavior.",
    why:"For one-off, deliberate decisions, rather than automatic habits, there are more places the process can silently break down, and this funnel exposes each one so you can pinpoint exactly where users are dropping off instead of treating the whole conversion as one opaque black box.",
    points:[{"text":"For a deliberate, non-habitual action, a user passes through six sequential mental gates:"},{"term":"Cue","text":"notice something"},{"term":"Reaction","text":"a gut response"},{"term":"Evaluation","text":"is it worth it?"},{"term":"Ability","text":"can I actually do it?"},{"term":"Timing","text":"is now the moment?"},{"term":"Experience","text":"was doing it actually good — shaping future behavior"}],
    when:"Apply it to single, deliberate conversion moments — an upgrade prompt, a one-time donation ask, a big purchase decision — rather than to everyday habitual interactions, which the Hook Model handles better.",
    how:"Walk a real user's likely path through all six gates (Cue, Reaction, Evaluation, Ability, Timing, Experience) and identify the specific gate where they're most likely to drop off; fix that gate directly, for example by moving a prompt's Timing to follow a positive Experience instead of interrupting a task.",
    example:[
      "An 'upgrade to Pro' prompt can fail purely on the Timing gate — the user might be motivated and able, but it appears mid-task and gets dismissed reflexively.",
      "A one-time donation prompt succeeds when it appears right after a positive Experience, like finishing a helpful article, rather than immediately on page load."
    ],
    watch:"Because this model has more failure points than Fogg's, it's best for diagnosing why a single, deliberate conversion action isn't happening — not for everyday habitual UI."},

  {cat:"beh", platform:"both", name:"Self-Determination Theory", hook:"Autonomy, Mastery, Purpose.",
    def:"A theory of intrinsic motivation stating that people are genuinely driven by three underlying needs: Autonomy, feeling in control of their own choices, Mastery, the satisfaction of getting better at something over time, and Purpose, a sense of belonging to something larger than themselves. Products that tap into these tend to sustain engagement without relying purely on external nudges.",
    why:"External nudges like notifications and rewards can drive short-term engagement, but they don't sustain it on their own — tapping into genuine intrinsic motivation (autonomy, mastery, purpose) builds engagement that holds up even without constant external prompting.",
    points:[{"text":"People are intrinsically driven by three underlying needs:"},{"term":"Autonomy","text":"feeling in control of your own choices"},{"term":"Mastery","text":"the satisfaction of getting better at something over time"},{"term":"Purpose","text":"a sense of belonging to something larger than yourself"},{"text":"Products that tap into these tend to sustain engagement without relying purely on external nudges."}],
    when:"Apply it when designing for long-term, sustained engagement rather than a single conversion moment — community products, learning products, or anything meant to matter to a user over months or years, not just one session.",
    how:"Audit your product for each pillar: does the user feel real Autonomy over meaningful choices, do they have a visible sense of Mastery or progress over time, and is there a Purpose or community larger than themselves to belong to? Strengthen whichever pillar is weakest rather than only adding more external rewards.",
    example:[
      "A fitness app showing a visible skill progression tree, mastery, alongside fully customizable goals, autonomy, and a community leaderboard, purpose.",
      "Open-source contribution platforms sustain long-term engagement largely through mastery and purpose, with very little external reward mechanics involved."
    ],
    watch:"This is a slower, deeper form of engagement than notification-driven habit loops — it's a poor fit for products that need fast, short-term growth metrics."},

  {cat:"beh", platform:"both", name:"Aesthetics & Emotion", hook:"Pretty things feel more usable.",
    def:"Attractive interfaces are consistently perceived by users as more usable, even when actual task success is identical, a well-documented effect. Emotions triggered by an interaction tend to be short-lived, minutes to hours, while the personality a user comes to ascribe to a whole product is far more durable and shapes long-term trust.",
    why:"Perceived usability directly affects trust and adoption, independent of actual functional quality — meaning visual polish isn't just decoration, it measurably changes how usable people believe your product to be, which shapes whether they give it a real chance.",
    points:[{"text":"Attractive interfaces are consistently perceived as more usable — even when actual task success is identical."},{"text":"Emotions from a single interaction fade in minutes or hours; the 'personality' a product earns in a user's mind lasts far longer."}],
    when:"Apply it any time you're tempted to deprioritize visual craft as 'just polish' relative to core functionality — recognize that the two aren't actually separable in how users perceive quality.",
    how:"Invest genuine design craft even on functionally 'solved' screens, and separately, run real usability testing specifically to catch cases where an attractive design might be masking a genuine usability flaw that users would otherwise have flagged.",
    example:[
      "Two functionally identical apps in a usability test — the more polished one is consistently rated easier to use, even with equal task completion rates.",
      "A brand's playful microcopy and illustration style, its personality, outlasts any single positive or negative interaction a user has with it."
    ],
    watch:"Aesthetic-driven perceived usability can also backfire — a beautiful interface that's actually hard to use may mask real usability problems from being caught in testing."},

  {cat:"strat", platform:"both", name:"Design Thinking Constraints", hook:"Desirable, Feasible, Viable.",
    def:"Successful product ideas need to satisfy three overlapping constraints simultaneously: Desirability, does anyone actually want this, Feasibility, can it realistically be built with current technology and skills, and Viability, does it make economic sense for the business. An idea that's strong on only one or two of these usually fails.",
    why:"Ideas commonly fail not because they lacked user demand, but because a team never seriously tested Feasibility or Viability until far too late — all three constraints have to hold simultaneously, and neglecting any one of them is a common, avoidable cause of failed launches.",
    points:[{"text":"Successful product ideas need to satisfy three overlapping constraints at once:"},{"term":"Desirability","text":"does anyone actually want this?"},{"term":"Feasibility","text":"can it realistically be built?"},{"term":"Viability","text":"does it make economic sense for the business?"},{"text":"An idea that's strong on only one or two of these usually fails."}],
    when:"Apply it during early-stage prioritization or roadmap decisions, before significant engineering investment is committed to any single idea.",
    how:"Score every candidate idea explicitly against all three dimensions, not just the one your team is naturally biased toward (product teams often over-weight Desirability, engineering-led teams over-weight Feasibility) — and treat a weak score on any single dimension as a real red flag, not something to paper over.",
    example:[
      "A voice-controlled smart fridge might be desirable, but if it's not feasible on current hardware at an acceptable cost, or not viable at the price point customers will pay, it won't ship successfully.",
      "A PM prioritization doc that scores each candidate feature against all three constraints, not just user demand, tends to surface hidden risks earlier."
    ],
    watch:"Teams frequently over-index on Desirability alone, what users say they want, and under-invest in honestly assessing Feasibility and Viability early."},

  {cat:"strat", platform:"both", name:"Double Diamond Model", hook:"Discover, Define, Develop, Deliver.",
    def:"A four-stage design process that deliberately alternates between divergent thinking, opening up to generate many possible options, and convergent thinking, narrowing down to a specific decision: Discover, explore the problem broadly, Define, narrow to the real problem statement, Develop, explore many possible solutions, and Deliver, narrow to and ship the chosen solution.",
    why:"Skipping the divergent half of either diamond, jumping straight to 'the' obvious problem or 'the' obvious solution, is one of the most common causes of teams building the wrong thing efficiently, because they never seriously considered alternatives.",
    points:[{"text":"A four-stage process that alternates divergent and convergent thinking:"},{"term":"Discover","text":"explore the problem broadly (divergent)"},{"term":"Define","text":"narrow to the real problem statement (convergent)"},{"term":"Develop","text":"explore many possible solutions (divergent)"},{"term":"Deliver","text":"narrow to and ship the chosen solution (convergent)"}],
    when:"Apply it when scoping any non-trivial product or design initiative from scratch, especially when the underlying problem isn't yet fully understood or agreed upon by the team.",
    how:"Force genuine divergence before every convergence: in Discover, generate a wide range of possible problem framings before narrowing to one in Define; in Develop, prototype multiple distinct solution concepts before narrowing to one to ship in Deliver.",
    example:[
      "Discover: broad user interviews reveal several possible causes of churn. Define: the team narrows in on one root cause. Develop: three different solution concepts are prototyped. Deliver: the winning concept is refined and shipped.",
      "A redesign project that skips straight from Discover to Deliver without a Define or Develop phase usually ends up solving the wrong problem efficiently."
    ],
    watch:"The two diamonds aren't optional shortcuts — skipping the divergent half of either diamond, jumping straight to the 'obvious' answer, is the most common way teams misuse this model."},

  {cat:"strat", platform:"both", name:"Lean UX", hook:"Learn fast, document less.",
    def:"An approach that prioritizes outcomes over polished deliverables, relying on rapid, low-cost MVP experiments to test specific hypotheses and build shared understanding across a cross-functional team, rather than producing heavy upfront specs or pixel-perfect mockups before anything is validated.",
    why:"Heavy upfront documentation and pixel-perfect design are expensive to produce and expensive to change — when the underlying assumption is still unvalidated, that investment is at high risk of being wasted entirely.",
    points:[{"text":"Prioritizes outcomes over polished deliverables."},{"text":"Uses rapid, low-cost MVP experiments to validate hypotheses and build shared understanding — instead of heavy upfront specs or pixel-perfect mockups."}],
    when:"Apply it early, when a core assumption behind a feature or product is still unproven, and the cost of being wrong is still low. It's less appropriate once you're committing real, hard-to-reverse investment.",
    how:"Identify the riskiest assumption underlying your idea, then design the cheapest possible experiment, a fake-door test, a manual concierge version, a rough prototype, that could prove or disprove it, before writing detailed specs or polished designs.",
    example:[
      "Shipping a manual, 'Wizard of Oz' concierge version of a feature, a human quietly doing the work behind the scenes, before investing in the fully automated version.",
      "A landing page that tests demand for a not-yet-built product feature, using signups as the validation signal before any engineering begins."
    ],
    watch:"Lean UX trades rigor for speed — it's excellent for validating risky, unproven assumptions, but shouldn't replace deeper research once real investment is on the line."},

  {cat:"strat", platform:"both", name:"Human-Centered Design (HCD)", hook:"Start with people, not screens.",
    def:"An approach that puts human needs, capabilities, and behavior first, typically starting with direct observation of users in their real, natural environment, not a lab or a survey, to surface thoughtless acts and latent needs that people themselves might not think to mention if simply asked.",
    why:"People often can't articulate their own latent needs or workarounds when simply asked directly — direct observation surfaces the 'thoughtless acts' and quiet workarounds that interviews and surveys alone routinely miss.",
    points:[{"text":"Puts human needs, capabilities, and behavior first."},{"text":"Starts with direct observation of users in their real environment — surfacing needs people wouldn't think to mention if simply asked."}],
    when:"Apply it when entering an unfamiliar domain or user group, or when a problem space is genuinely not well understood yet — it's a heavier investment, so it's less necessary for small, well-understood, incremental changes.",
    how:"Go observe real users in their actual environment doing the real task, not a simulated version of it, and pay specific attention to workarounds, hesitations, and improvised behaviors — those are usually where the real unmet need is hiding.",
    example:[
      "Watching farmers actually use a paper ledger in the field, rather than just asking them to describe their record-keeping process, before designing a digital replacement.",
      "Observing how nurses actually move through a hospital ward during a shift change reveals workflow needs that a formal interview alone would likely miss."
    ],
    watch:"Field observation is time- and resource-intensive — it's most valuable for unfamiliar domains or user groups, less critical for well-understood, incremental changes."},

  {cat:"strat", platform:"both", name:"UX Strategy Tenets", hook:"Four pillars hold up good UX.",
    def:"A solid UX strategy requires balancing four pillars together, not just one: Business Strategy, alignment with real company goals, Value Innovation, offering a genuinely differentiated alternative, not a copy of competitors, Validated User Research, real evidence, not assumptions, and Frictionless UX, execution quality in the actual interface.",
    why:"A product can excel at any single pillar, gorgeous interface, novel value proposition, rock-solid research, and still fail if the other pillars are neglected — real product success requires holding all four together, not choosing a favorite.",
    points:[{"text":"A solid UX strategy balances four pillars together, not just one:"},{"term":"Business Strategy","text":"alignment with real company goals"},{"term":"Value Innovation","text":"a genuinely differentiated alternative, not a copy of competitors"},{"term":"Validated User Research","text":"real evidence, not assumptions"},{"term":"Frictionless UX","text":"execution quality in the actual interface"}],
    when:"Apply it when evaluating whether an overall product or UX strategy is actually complete, particularly before a major launch or strategic pivot.",
    how:"Explicitly check your strategy against all four pillars: is it aligned with real business goals, does it offer a genuinely differentiated value versus alternatives, is it backed by validated research rather than assumptions, and is the actual execution frictionless? A weak answer on any pillar is a strategic gap worth addressing directly.",
    example:[
      "A beautifully frictionless app that ignores the underlying business model still eventually fails, no matter how well-crafted its interface is.",
      "A product with strong user research but no meaningful value differentiation from competitors struggles to gain traction even if it's technically well-designed."
    ],
    watch:"It's tempting to treat 'UX strategy' as pure craft, the fourth pillar, — the first three are often the actual reason a well-designed product still fails commercially."},

  {cat:"strat", platform:"both", name:"Start With Words", hook:"Copy before wireframes.",
    def:"UI design should begin with copywriting, explicitly drafting the real dialogue between the user and the system, before jumping into visual layout or wireframes. Words define the actual interaction and expectations; the visual design exists to support that conversation, not the other way around.",
    why:"The actual interaction between a user and a system happens through language, labels, messages, prompts, before it happens through visuals — if the words are unclear or wrong, no amount of visual polish afterward can fully fix the underlying confusion.",
    points:[{"text":"UI design should begin with copywriting — the real dialogue between user and system — before any visual layout."},{"text":"Words define the actual interaction; the visual design exists to support that conversation, not the other way around."}],
    when:"Apply it at the very start of designing any new flow or feature, before wireframes or visual mockups are created, especially for error states, confirmations, and onboarding copy.",
    how:"Draft the literal text of every message, label, and prompt the user will encounter first, as if writing a script for a conversation; only move to visual layout once that underlying dialogue reads clearly and makes sense on its own.",
    example:[
      "Drafting the exact text of every error message and empty state before a single wireframe is drawn, to make sure the actual guidance makes sense first.",
      "Writing the confirmation copy for a destructive action, 'This will permanently delete 12 files. This can't be undone.', before deciding what the confirmation dialog even looks like."
    ],
    watch:"This is a sequencing discipline, not a rule that visuals don't matter — strong copy still needs strong visual hierarchy to actually be noticed and read."},

  {cat:"mech", platform:"both", name:"Nielsen's 10 Usability Heuristics", hook:"The 10-point checklist usability pros reach for first.",
    def:"Jakob Nielsen's canonical ten general principles for interaction design, first published in 1994 and still the most widely used checklist for spotting usability problems without running a full user study.",
    why:"It's the single most-cited framework in UX interviews and heuristic evaluations — three to five reviewers checking a design against these ten catch roughly three-quarters of a product's usability problems without needing a single user test.",
    points:[{"text":"Several of these ideas already live elsewhere in this library under different names — this is the exact canonical list interviewers expect you to recite:"},{"term":"Visibility of System Status","text":"the system always shows what's happening (this library's Feedback)"},{"term":"Match Between System & the Real World","text":"speak the user's language, not internal jargon or database terms"},{"term":"User Control & Freedom","text":"give people an obvious way to undo, cancel, or exit"},{"term":"Consistency & Standards","text":"identical elements should behave identically throughout"},{"term":"Error Prevention","text":"stop mistakes before they happen (this library's Poka-Yoke)"},{"term":"Recognition Rather Than Recall","text":"show options instead of making people remember them (this library's Cognitive Load)"},{"term":"Flexibility & Efficiency of Use","text":"give experienced users accelerators — shortcuts, gestures — without cluttering things for beginners"},{"term":"Aesthetic & Minimalist Design","text":"every extra element competes with the ones that actually matter"},{"term":"Help Recognize, Diagnose & Recover From Errors","text":"error messages should say what went wrong and what to do next, in plain language"},{"term":"Help & Documentation","text":"even a well-designed product sometimes needs findable, searchable help"}],
    when:"Apply it when you need a fast, structured way to audit an existing interface, or when an interviewer asks you to critique a screen on the spot.",
    how:"Walk any screen against all ten heuristics in order, flagging violations and rating each by severity, rather than reviewing free-form — the structure is what catches issues a casual look misses.",
    example:[
      "A generic 'Error occurred' message violates error recovery; rewriting it as 'Card declined — check the number and try again' fixes it.",
      "A settings screen that behaves differently on the profile tab than the billing tab violates Consistency & Standards."
    ],
    watch:"Treating the ten as a rigid rulebook rather than a checklist — some heuristics trade off against each other (like minimalism vs. help & documentation), and judgment is still required."},

  {cat:"vis", platform:"both", name:"Gestalt Principles of Grouping", hook:"The brain groups before it reads a single word.",
    def:"A set of perceptual rules describing how people automatically organize visual elements into groups — proximity, similarity, closure, continuity, figure/ground, and common region — before consciously thinking about layout at all.",
